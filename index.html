<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>가맹점 서류 접수 및 계약서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
  font-weight:700; font-display:swap;
}
@font-face{
  font-family:'Plex Mono';
  src:url('https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  font-weight:500; font-display:swap;
}

:root{
  --bg:#F1F3F6;
  --paper:#FFFFFF;
  --ink:#10233D;
  --ink-soft:#5B6B7A;
  --line:#E1E5EA;
  --line-strong:#C7CFD8;
  --teal:#12A398;
  --teal-deep:#0B7A72;
  --forest:#2F8F5B;
  --forest-bg:#EAF6EF;
  --red:#E24C4C;
  --red-bg:#FDEDED;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,35,61,0.04), 0 8px 24px rgba(16,35,61,0.06);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'Plex Mono','Pretendard',monospace;}

#app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
#app.admin-app{max-width:1440px;}
.admin-table-scroll{overflow-x:auto;border-radius:var(--radius);}
.admin-table{width:100%;min-width:1180px;border-collapse:separate;border-spacing:0;text-align:left;font-size:13px;}
.admin-table th{
  white-space:nowrap;position:sticky;top:0;z-index:2;
  background:#F8FAFC;color:var(--ink-soft);font-weight:700;font-size:12px;
  letter-spacing:.01em;padding:13px 14px;border-bottom:1.5px solid var(--line-strong);
}
.admin-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.admin-table tbody tr{transition:background .12s;}
.admin-table tbody tr:nth-child(even){background:#FAFBFC;}
.admin-table tbody tr:hover{background:#F1FBFA;}
.admin-table .no-wrap{white-space:nowrap;}
.admin-table .mono-cell{font-family:'Plex Mono','Pretendard',monospace;font-size:12px;color:var(--ink-soft);}
.contact-cell{display:flex;flex-direction:column;gap:4px;}
.contact-row{display:flex;align-items:center;gap:6px;font-family:'Plex Mono','Pretendard',monospace;font-size:12px;white-space:nowrap;}
.contact-tag{
  flex:0 0 auto;font-family:'Pretendard';font-size:10px;font-weight:700;color:var(--ink-soft);
  background:#EEF1F5;border-radius:4px;padding:1px 5px;
}
.contact-row.empty{color:#B9C2CC;}
.admin-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:120px;margin:0 auto;}
.admin-actions button{
  width:100%;padding:6px 0;border:none;border-radius:6px;color:white;font-weight:700;
  font-size:11px;cursor:pointer;transition:filter .12s;white-space:nowrap;
}
.admin-actions button:hover{filter:brightness(0.93);}
.admin-edit-actions{display:flex;gap:6px;justify-content:center;}
.admin-edit-actions button{padding:6px 12px;border-radius:6px;font-weight:700;font-size:11.5px;cursor:pointer;}
.inline-edit-button{margin-left:6px;background:var(--paper);color:var(--teal-deep);border:1px solid var(--line-strong);padding:3px 7px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.inline-edit-button:hover{border-color:var(--teal);background:#F1FBFA;}
@media(max-width:700px){
  #app.admin-app{padding:18px 12px 48px;}
  .topbar{align-items:flex-start;gap:14px;flex-direction:column;}
}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:700;font-size:15px;
  box-shadow:var(--shadow);
}
.brand-text{font-weight:700;font-size:16px;letter-spacing:-0.01em;}
.brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

.secret-zone {
  width: 70px; 
  height: 40px; 
  background: transparent; 
  cursor: default; 
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow);
}
.section-title{font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
.section-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 24px;line-height:1.5;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.field .req{color:var(--red);margin-left:2px;}
.field .optional{color:var(--ink-soft);font-weight:400;font-size:11.5px;margin-left:4px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password],.field select, .field input[type=date]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;
  font-family:'Pretendard';background:#FCFCFD;transition:.12s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:white;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}

.radio-group{display:flex;gap:20px;margin-top:8px;}
.radio-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;}
.radio-label input{accent-color:var(--teal);width:18px;height:18px;cursor:pointer;}

.opt-group-label{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px;}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.doc-grid{grid-template-columns:1fr;}}
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;cursor:pointer;
  transition:.14s;position:relative;overflow:hidden;background:#FBFBFC;
}
.dropzone:hover{border-color:var(--teal);background:#F1FBFA;}
.dropzone.filled{border-style:solid;border-color:var(--forest);background:var(--forest-bg);}
.dz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.dz-title{font-size:13px;font-weight:600;}
.dz-title .req{color:var(--red);}
.dz-title .optional{color:var(--ink-soft);font-weight:400;font-size:11px;}
.dz-status{font-size:11px;color:var(--ink-soft);}
.dz-status.ok{color:var(--forest);font-weight:600;}
.dz-preview{margin-top:9px;display:flex;align-items:center;gap:9px;}
.dz-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:0 0 44px;}
.dz-filename{font-size:11.5px;color:var(--ink-soft);word-break:break-all;line-height:1.4;}
.dz-placeholder{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.dz-remove{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:0;margin-left:auto;flex:0 0 auto;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Pretendard';font-size:15px;font-weight:600;padding:14px 20px;border-radius:11px;
  border:none;cursor:pointer;transition:.14s;width:100%;
}
.btn-primary{background:var(--ink);color:white;}
.btn-primary:hover{background:#0A1A2E;}
.btn-primary:disabled{background:var(--line-strong);color:#9AA5B1;cursor:not-allowed;}
.btn-secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);}
.btn-secondary:hover{background:#F8FAFC;}
.btn-row{margin-top:24px;display:flex;gap:10px;}

.temp-save-box {
  background: #F8FAFC;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.temp-save-info { font-size: 13px; color: var(--ink-soft); }
.temp-save-btns { display: flex; gap: 8px; }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; width: auto; }

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 서류 접수 진행 중 오버레이 - 정지 화면처럼 보이지 않도록 애니메이션으로 진행 상태를 명확히 표시 */
.submit-overlay{
  position:fixed;inset:0;background:rgba(15,23,32,0.55);backdrop-filter:blur(2px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.submit-overlay.show{opacity:1;pointer-events:all;}
.submit-overlay-box{
  background:var(--paper);border-radius:20px;padding:36px 30px 30px;max-width:340px;width:100%;
  text-align:center;box-shadow:var(--shadow);
}
.submit-spinner{
  width:52px;height:52px;margin:0 auto 20px;border-radius:50%;
  border:4px solid var(--line);border-top-color:var(--teal);
  animation:submit-spin .8s linear infinite;
}
@keyframes submit-spin{ to{ transform:rotate(360deg); } }
.submit-overlay-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.submit-overlay-msg{font-size:13px;color:var(--ink-soft);line-height:1.6;min-height:38px;}
.submit-overlay-bar{
  margin-top:20px;height:5px;border-radius:100px;background:var(--line);overflow:hidden;position:relative;
}
.submit-overlay-bar::after{
  content:'';position:absolute;top:0;left:0;height:100%;width:40%;border-radius:100px;
  background:var(--teal);animation:submit-bar-move 1.3s ease-in-out infinite;
}
@keyframes submit-bar-move{
  0%{ left:-40%; }
  100%{ left:100%; }
}
.submit-overlay-elapsed{margin-top:14px;font-size:11.5px;color:#B9C2CC;font-variant-numeric:tabular-nums;}

.success-wrap{max-width:520px;margin:40px auto;text-align:center;}
.success-badge{
  width:72px;height:72px;border-radius:50%;background:var(--forest-bg);color:var(--forest);
  display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;
}
.success-wrap h2{font-size:22px;margin:0 0 8px;}
.success-wrap p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 22px;}
.receipt-num{
  display:inline-block;font-family:'Plex Mono';font-size:14px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:9px 16px;font-weight:600;letter-spacing:.02em;margin-bottom:24px;
}

.admin-login{max-width:360px;margin:60px auto;}
.admin-search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;margin-bottom:16px;font-family:'Pretendard';}

.eq-item{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#FBFBFC;}
.eq-item.active{border-color:var(--teal);background:#F1FBFA;}
.eq-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.eq-item-name{font-size:14.5px;font-weight:700;}
.eq-item-price{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.eq-stepper{display:flex;align-items:center;gap:10px;}
.eq-stepper button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:white;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);}
.eq-stepper button:hover{border-color:var(--teal);color:var(--teal);}
.eq-stepper .eq-qty{width:32px;text-align:center;font-weight:700;font-size:14.5px;}
.eq-options{margin-top:12px;display:flex;gap:16px;}
.eq-options label{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer;}
.eq-options input{accent-color:var(--teal);}
.eq-summary{position:sticky;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);padding:16px 0 4px;margin-top:8px;}
.eq-summary-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:var(--ink-soft);}
.eq-summary-row.total{font-size:15px;font-weight:700;color:var(--ink);}

.contract-page{
  background:white;border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 28px;box-shadow:var(--shadow);font-size:11px;line-height:1.45;
  margin-bottom:24px;
}
.contract-top-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:20px;letter-spacing:2px;text-decoration: underline;}
.ref-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
.ref-table th,.ref-table td{border:1px solid #111;padding:6px 8px;text-align:center;}
.ref-table th{background:#F2F2F2;font-weight:600;}
.ref-table td.al{text-align:left;}

.contract-intro{margin-bottom:12px;font-size:11px;text-align:justify;}
.clause-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
.clause-col{display:flex;flex-direction:column;gap:8px;}
.contract-doc .clause{margin-bottom:4px;text-align:justify;}
.contract-doc .clause b{display:inline;margin-right:4px;}
.contract-table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px;}
.contract-table th,.contract-table td{border:1px solid #111;padding:4px 6px;text-align:center;}
.contract-table th{background:#F2F2F2;}
.contract-table td.al{text-align:left;}
.contract-note{font-size:10px;color:var(--ink-soft);margin:4px 0;}
.editable-penalty{background:#FFFDF0;border:1px dashed var(--teal);padding:2px 6px;border-radius:4px;display:inline-block;outline:none;color: var(--red);}
.editable-penalty:focus{background:#FFF;border-style:solid;}

/* 모달 레이어 스타일 */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(16, 35, 61, 0.4); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-box {
  background: white; border-radius: var(--radius); width: 100%; max-width: 540px;
  max-height: 85vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow);
}
.modal-title { font-size: 16.5px; font-weight: 700; margin-bottom: 6px; }
.modal-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }
.modal-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.modal-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.modal-item input { accent-color: var(--teal); width: 18px; height: 18px; cursor: pointer; }

/* 파일 첨부 방식 선택 시트 (직접 촬영 / 사진첩 / 파일) */
.upload-sheet-overlay{ align-items: flex-end; }
@media (min-width: 640px){ .upload-sheet-overlay{ align-items: center; } }
.upload-sheet-box{ max-width: 420px; border-radius: 20px 20px 0 0; padding: 22px 18px 18px; }
@media (min-width: 640px){ .upload-sheet-box{ border-radius: var(--radius); } }
.upload-choice-list{ display:flex; flex-direction:column; gap:10px; margin: 14px 0 16px; }
.upload-choice-btn{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:#F8FAFC; border:1.5px solid var(--line); border-radius:12px;
  padding:13px 14px; cursor:pointer; transition:.12s;
}
.upload-choice-btn:hover{ background:#F1FBFA; border-color: var(--teal); }
.upload-choice-btn:active{ transform: scale(0.98); }
.upload-choice-icon{ font-size:22px; flex:0 0 auto; }
.upload-choice-text{ display:flex; flex-direction:column; gap:2px; }
.upload-choice-text b{ font-size:14px; color: var(--ink); }
.upload-choice-text small{ font-size:11.5px; color: var(--ink-soft); font-weight:400; }

/* CMS 동의서 전용 스타일 */
.cms-page{
  background:white;border:1px solid var(--line);border-radius:var(--radius);
  padding:30px;box-shadow:var(--shadow);font-size:12px;line-height:1.5;color:#333;
}
.cms-page h1 {
  text-align: center; font-size: 20px; text-decoration: underline; margin-bottom: 20px; letter-spacing: 2px; font-weight: 700;
}
.cms-page h2 {
  font-size: 14px; margin-top: 18px; margin-bottom: 8px; font-weight: 700;
}
.cms-page table {
  width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 12px;
}
.cms-page th, .cms-page td {
  border: 1px solid #000; padding: 6px 8px; vertical-align: middle;
}
.cms-page th {
  background-color: #f2f2f2; text-align: center; font-weight: bold; width: 18%;
}
.cms-page td {
  text-align: left;
}
.cms-page .center-text { text-align: center; }
.cms-page .consent-box {
  border: 1px solid #000; padding: 10px 12px; font-size: 11px; margin-bottom: 12px; background-color: #fafafa;
}
.cms-page .consent-title {
  font-weight: bold; font-size: 12px; margin-top: 8px; margin-bottom: 4px;
}
.cms-page .consent-title:first-child { margin-top: 0; }
.cms-page .consent-content { margin-left: 8px; margin-bottom: 6px; color: #444; }
.cms-page .consent-check {
  text-align: right; font-weight: bold; margin-top: 4px; margin-bottom: 6px; font-size: 11.5px;
}
.cms-page .highlight, .contract-page .highlight {
  background-color: #ffeb3b; padding: 2px 5px; border-radius: 3px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact;
}
.cms-page .submit-notice {
  text-align: center; font-size: 12.5px; font-weight: bold; margin: 16px 0 12px 0;
}
.cms-page .date {
  text-align: center; font-size: 15px; font-weight: bold; margin-bottom: 16px;
}
.cms-page .signature-table { width: 85%; margin: 0 auto 10px auto; }
.cms-page .signature-table th { width: 25%; }
.cms-page .footer-note { font-size: 10.5px; color: #666; margin-top: 8px; }

.no-print{margin-top:20px;display:flex;gap:10px;}
@media print{
  .contract-page, .cms-page {
    width: 99% !important;
    box-sizing: border-box;
  }
}
@media print{
  @page { size: A4 portrait; margin: 10mm; }
  body{background:white; color:#000;}
  .no-print,.topbar,.toast{display:none !important;}
  #app{max-width:none;padding:0;margin:0;}
  .contract-page{
    border:none !important;box-shadow:none !important;padding:0 !important;margin:0 !important;
    page-break-after:always !important; break-after:page !important;
  }
  .cms-page{
    border:none !important;box-shadow:none !important;padding:0 !important;margin:0 !important;
    page-break-after:always !important; break-after:page !important;
  }
  /* [빈 페이지 방지] 실제로 마지막에 출력되는 페이지에는 이 클래스를 붙여서
     뒤에 강제로 페이지가 넘어가는 것(→ 인쇄 시 빈 페이지 발생)을 막는다. */
  .contract-page.page-no-break, .cms-page.page-no-break{
    page-break-after: auto !important; break-after: auto !important;
  }
  .editable-penalty{border:none !important;background:transparent !important;padding:0 !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="submit-overlay" id="submit-overlay">
  <div class="submit-overlay-box">
    <div class="submit-spinner"></div>
    <div class="submit-overlay-title">서류를 접수하고 있어요</div>
    <div class="submit-overlay-msg" id="submit-overlay-msg">잠시만 기다려주세요...</div>
    <div class="submit-overlay-bar"></div>
    <div class="submit-overlay-elapsed" id="submit-overlay-elapsed">0초 경과</div>
  </div>
</div>

<script>

function getRequiredDocs(businessType, bizType, hasSign){
  if (state.isSupplementMode && state.supplementDocKeys.length > 0) {
    const allSupplementSelectable = [...ORIGINAL_REQUEST_DOC_LIST, ...SUPPLEMENT_DOC_LIST];
    return allSupplementSelectable.filter(d => state.supplementDocKeys.includes(d.key)).map(d => ({
      key: d.key,
      label: d.label,
      accept: 'image/*,.pdf',
      hint: `${d.label} 사본 첨부`,
      required: true
    }));
  }

  if (state.isPaymentMode) {
    let docs = [...PAYMENT_COMMON_DOCS];
    if (state.paymentService === 'naver' && state.paymentNaverPlace === 'unregistered') {
      docs = docs.concat(PAYMENT_NAVER_UNREGISTERED_DOCS);
    }
    return docs;
  }

  // 서류는 실제 접수 흐름에 맞춰
  // ① 사업자 확인 → ② 정산정보 → ③ 대표자 확인 → ④ 매장 확인 → ⑤ 추가서류
  // 순서로 표시한다.
  const doc = (key, label, accept, hint) => ({
    key, label, accept, hint, required:true
  });

  let docs = [];

  // 1. 사업자 확인
  if (bizType === 'nonprofit_org') {
    docs.push(doc('uniqueNo', '고유번호증', 'image/*,.pdf', '고유번호증 사본'));
  } else if (bizType === 'other') {
    docs.push(doc('otherBizProof', '사업자등록증 또는 고유번호증', 'image/*,.pdf', '사업자등록증 또는 고유번호증 사본'));
  } else {
    docs.push(doc('bizLicense', '사업자등록증', 'image/*,.pdf', '사업자등록증 사본'));
  }

  if (bizType === 'corporate') {
    // 일반 법인
    docs.push(doc('corpReg', '법인등기부등본', 'image/*,.pdf', '말일 포함 최근 등기부등본'));
    docs.push(doc('corpSeal', '법인인감증명서', 'image/*,.pdf', '최근 3개월 이내 발급분'));
  } else if (bizType === 'nonprofit') {

function formatKoreanPhone(value) {
  let digits = String(value == null ? '' : value).replace(/\D/g, '');
  if (digits && digits.charAt(0) !== '0') digits = '0' + digits;
  if (digits.length <= 3) return digits;
  if (digits.indexOf('02') === 0) {
    if (digits.length <= 5) return digits.slice(0, 2) + '-' + digits.slice(2);
    if (digits.length === 9) return digits.slice(0, 2) + '-' + digits.slice(2, 5) + '-' + digits.slice(5);
    return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6, 10);
  }
  if (digits.length <= 7) return digits.slice(0, 3) + '-' + digits.slice(3);
  return digits.slice(0, 3) + '-' + digits.slice(3, -4) + '-' + digits.slice(-4);
}

// [기타 판매 제품 직접입력용] 숫자만 남기고 천단위 콤마를 붙여준다.
function formatMoneyInput(value) {
  const digits = String(value == null ? '' : value).replace(/\D/g, '');
  if (!digits) return '';
  return Number(digits).toLocaleString('ko-KR');
}

// 서류 접수/제출 중 진행 상태를 명확히 보여주는 오버레이.
// render() 재호출과 무관하게 동작하도록 #app 바깥의 고정 DOM을 직접 제어한다.
// 업로드 + 서버 OCR 처리가 문서 개수에 따라 수십 초 걸릴 수 있어,
// 그 시간 동안 "멈춘 것처럼" 보이지 않도록 스피너/진행바/경과 시간/단계별 안내문구를 보여준다.
const SUBMIT_OVERLAY_STAGES = [
  { atSec: 0,  msg: '첨부하신 서류를 업로드하고 있어요...' },
  { atSec: 4,  msg: 'AI가 서류 내용을 확인하고 있어요...' },
  { atSec: 12, msg: '사업자등록증·통장사본 정보를 인식하고 있어요...' },
  { atSec: 25, msg: '거의 다 됐어요, 조금만 더 기다려주세요...' },
  { atSec: 45, msg: '문서 양이 많아 시간이 더 걸리고 있어요. 창을 닫지 말고 기다려주세요.' }
];

function showSubmitOverlay(){
  const overlay = document.getElementById('submit-overlay');
  const msgEl = document.getElementById('submit-overlay-msg');
  const elapsedEl = document.getElementById('submit-overlay-elapsed');
  window.__submitOverlayStart = Date.now();
  msgEl.textContent = SUBMIT_OVERLAY_STAGES[0].msg;
  elapsedEl.textContent = '0초 경과';
  overlay.classList.add('show');

  // 접수 진행 중 실수로 새로고침/닫기 하면 서류가 일부만 저장될 수 있어 경고
  window.onbeforeunload = function(e){
    e.preventDefault();
    e.returnValue = '';
    return '';
  };

  clearInterval(window.__submitOverlayTimer);
  window.__submitOverlayTimer = setInterval(() => {
    const elapsedSec = Math.floor((Date.now() - window.__submitOverlayStart) / 1000);
    elapsedEl.textContent = elapsedSec + '초 경과';
    let currentMsg = SUBMIT_OVERLAY_STAGES[0].msg;
    for (const stage of SUBMIT_OVERLAY_STAGES) {
      if (elapsedSec >= stage.atSec) currentMsg = stage.msg;
    }
    if (msgEl.textContent !== currentMsg) msgEl.textContent = currentMsg;
  }, 1000);
}

function hideSubmitOverlay(){
  const overlay = document.getElementById('submit-overlay');
  overlay.classList.remove('show');
  clearInterval(window.__submitOverlayTimer);
  window.onbeforeunload = null;
}

function render(){
  const app = document.getElementById('app');
  if(state.view === 'form') syncFields();
  // [최적화] 이 앱은 상태가 바뀔 때마다 화면 전체를 문자열로 다시 그려서 갈아끼우는 방식이라
  // (가상DOM이 아니라 innerHTML 통재교체), 재렌더링 시점에 어떤 입력창에 포커스가 있었다면
  // 그 포커스와 커서 위치를 기억해뒀다가 새로 그려진 뒤 그대로 복원한다.
  // 이렇게 하면 "타이핑 중 렌더링이 껴서 포커스가 끊기는" 문제를 이 함수 한 곳에서
  // 근본적으로 막아준다 (관리자 검색창 등 id가 있는 모든 입력창에 자동 적용됨).
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
    focusId = active.id;
    // [안전장치] type="number" 등 일부 입력 타입은 selectionStart를 읽기만 해도
    // 브라우저가 예외를 던진다. 그러면 render() 전체가 중간에 멈춰버리므로 try/catch로 감싼다.
    try {
      if (typeof active.selectionStart === 'number') {
        selStart = active.selectionStart;
        selEnd = active.selectionEnd;
      }
    } catch(e) { /* number 등 선택범위 미지원 타입은 무시하고 포커스만 복원 */ }
  }

  app.className = state.view === 'admin' ? 'admin-app' : '';
  if(state.view === 'form') app.innerHTML = topbar() + renderForm();
  else if(state.view === 'success') app.innerHTML = topbar() + renderSuccess();
  else if(state.view === 'adminLogin') app.innerHTML = renderAdminLogin();
  else if(state.view === 'admin') app.innerHTML = renderAdmin();
  else if(state.view === 'equipmentSelect') app.innerHTML = topbar() + renderEquipmentSelect();
  else if(state.view === 'contract') app.innerHTML = renderContract();

  if(state.activeModalMerchant) {
    app.innerHTML += renderSupplementModal();
  }
  if(state.showNewAppModal) {
    app.innerHTML += renderNewAppModal();
  }
  if(state.uploadChoiceKey) {
    app.innerHTML += renderUploadChoiceSheet();
  }

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart !== null && typeof el.setSelectionRange === 'function') {
        try { el.setSelectionRange(selStart, selEnd); } catch(e) {}
      }
    }
  }
}

function renderDropzone(d){
  const filesArr = state.files[d.key] || [];
  const hasFiles = filesArr.length > 0;
  const labelBadge = d.required ? `<span class="req">*</span>` : `<span class="optional">(선택)</span>`;
  const guide = DOC_SHOT_GUIDE[d.key] || DEFAULT_SHOT_GUIDE;
  const isGuideOpen = state.openShotGuideKey === d.key;
  return `
  <div class="dropzone ${hasFiles?'filled':''}">
    <input type="file" id="file_${d.key}" accept="${d.accept}" multiple style="display:none" onchange="App.handleFile('${d.key}', this.files); this.value='';">
    <div class="dz-head" style="cursor:pointer;" onclick="App.openUploadChoice('${d.key}', '${d.accept}', '${escapeAttr(d.label)}')">
      <div class="dz-title">${d.label} ${labelBadge}</div>
      <div class="dz-status ${hasFiles?'ok':''}">${hasFiles ? filesArr.length + '장 첨부됨' : '미첨부'}</div>
    </div>
    <button type="button" onclick="event.stopPropagation(); App.toggleShotGuide('${d.key}')" style="background:none;border:none;color:var(--teal-deep);font-size:11px;font-weight:600;cursor:pointer;padding:2px 0 0;">
      📷 촬영 예시 ${isGuideOpen ? '접기 ▲' : '보기 ▼'}
    </button>
    ${isGuideOpen ? `
      <div style="margin-top:6px; background:#FBFBFC; border:1px solid var(--line); border-radius:8px; padding:10px;" onclick="event.stopPropagation()">
        ${renderShotGuideSVG(guide.type)}
        <ul style="margin:8px 0 0; padding-left:16px; font-size:11px; color:var(--ink-soft); line-height:1.6;">
          ${guide.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}
        </ul>
      </div>
    ` : ''}
    ${hasFiles ? `
      ${filesArr.map((f, idx) => `
        <div class="dz-preview">
          ${f.isImage ? `<img class="dz-thumb" src="${f.dataUrl}">` : `<div class="dz-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);">FILE</div>`}
          <div class="dz-filename">${f.name}</div>
          <button class="dz-remove" onclick="App.removeFile('${d.key}', ${idx})">삭제</button>
        </div>
      `).join('')}
      <button type="button" class="btn btn-secondary btn-sm" style="width:auto;margin-top:8px;" onclick="App.openUploadChoice('${d.key}', '${d.accept}', '${escapeAttr(d.label)}')">+ 사진 추가</button>
    ` : `<div class="dz-placeholder" style="cursor:pointer;" onclick="App.openUploadChoice('${d.key}', '${d.accept}', '${escapeAttr(d.label)}')">${d.hint} <span style="color:var(--teal);font-weight:600;">(여러 장 선택 가능)</span></div>`}
  </div>`;
}

function escapeHtml(str){
  return String(str||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function escapeAttr(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function fmt(n){ return Number(n||0).toLocaleString('ko-KR'); }

function calcRentalMonthly(sel){
  let total = 0;
  for(const key in RENTAL_CATALOG){
    const item = RENTAL_CATALOG[key];
    const s = sel.rental[key];
    if(s && s.qty > 0) total += item.monthlyPrice * s.qty;
  }
  for(const key in RENTAL_ADDONS){
    const item = RENTAL_ADDONS[key];
    const s = sel.addons[key];
    if(s && s.qty > 0) total += item.monthlyPrice * s.qty;
  }
  return total;
}

function buildIndemnityRows(sel){
  const rows = [];
  for(const key in RENTAL_CATALOG){
    const item = RENTAL_CATALOG[key];
    const s = sel.rental[key];
    if(!s || s.qty <= 0) continue;
    let unit, optionLabel = '';
    if(item.hasOption){
      unit = item.indemnityByOption[s.option];
      optionLabel = s.option === 'naver' ? '네이버커넥트' : '토스프론트';
    } else {
      unit = item.indemnity;
    }
// 모델 정보 추가 (선택)
let modelInfo = '';
const selItem = sel.rental && sel.rental[key];
if(selItem){
  // pos 모델 정보
  if(selItem.posModel){
    if(selItem.posModel === 'other') modelInfo += (selItem.posModelOther || '');
    else {
      const found = (typeof POS_MODELS !== 'undefined') ? POS_MODELS.find(m=>m.id===selItem.posModel) : null;
      modelInfo += (found && found.label) ? found.label : selItem.posModel;
    }
  }
  // terminal 모델 정보
  if(selItem.terminalModel){
    if(modelInfo) modelInfo += ' / ';
    if(selItem.terminalModel === 'other') modelInfo += (selItem.terminalModelOther || '');
    else {
      const foundT = (typeof TERMINAL_MODELS !== 'undefined') ? TERMINAL_MODELS.find(m=>m.id===selItem.terminalModel) : null;
      modelInfo += (foundT && foundT.label) ? foundT.label : selItem.terminalModel;
    }
  }
  if(modelInfo) modelInfo = ` (${modelInfo})`;
}

rows.push({
  name: item.label + (optionLabel ? ` (${optionLabel})` : '') + (modelInfo || ''),
  qty: s.qty,
  unit: unit,
  amount: (unit==null ? null : unit * s.qty)
});
  }
  for(const key in RENTAL_ADDONS){
    const item = RENTAL_ADDONS[key];
    const s = sel.addons[key];
    if(!s || s.qty <= 0) continue;
    rows.push({
      name: item.label,
      qty: s.qty,
      unit: item.indemnity,
      amount: (item.indemnity==null ? null : item.indemnity * s.qty)
    });
  }
  return rows;
}

function hasSaleSelection(sel){
  if(!sel.sale) return false;
  const fixedQty = Object.keys(SALE_CATALOG).some(k => sel.sale[k] && sel.sale[k].qty > 0);
  const customQty = Array.isArray(sel.sale.custom) && sel.sale.custom.some(r => r && r.qty > 0 && r.unitPrice > 0);
  return fixedQty || customQty;
}

function hasAnySelection(sel){
  const rentalQty = Object.values(sel.rental).some(s=>s.qty>0);
  const addonQty = Object.values(sel.addons).some(s=>s.qty>0);
  return rentalQty || addonQty || hasSaleSelection(sel);
}

// [판매 품목] 선택된 키오스크 등 일시불 구매 품목 + 기타(직접입력) 품목의
// 공급가액/부가세/합계 행을 만든다.
function buildSaleRows(sel){
  const rows = [];
  if(!sel.sale) return rows;
  for(const key in SALE_CATALOG){
    const item = SALE_CATALOG[key];
    const s = sel.sale[key];
    if(!s || s.qty <= 0) continue;
    const supply = item.price * s.qty;
    const vat = Math.round(supply * 0.1);
    rows.push({
      name: item.label,
      qty: s.qty,
      unitPrice: item.price,
      supply: supply,
      vat: vat,
      total: supply + vat
    });
  }
  if(Array.isArray(sel.sale.custom)){
    sel.sale.custom.forEach(row => {
      if(!row || !(row.qty > 0) || !(row.unitPrice > 0)) return;
      const supply = row.unitPrice * row.qty;
      const vat = Math.round(supply * 0.1);
      rows.push({
        name: (row.name && row.name.trim()) ? row.name.trim() : '기타 판매 제품',
        qty: row.qty,
        unitPrice: row.unitPrice,
        supply: supply,
        vat: vat,
        total: supply + vat
      });
    });
  }
  return rows;
}

// [출력 매수] 페이지 블록 안의 <!--MARKER_START--> ~ <!--MARKER_END--> 구간을
// copyLabels 배열 개수만큼 반복 출력하고, 그 안의 __COPY_LABEL__ 자리마다 각 사본
// 이름((보관용)/(고객용) 등)을 채워 넣는다. 마커가 없으면 원본을 그대로 반환한다.
function expandPageCopies_(html, marker, copyLabels){
  const startTag = `<!--${marker}_START-->`;
  const endTag = `<!--${marker}_END-->`;
  const startIdx = html.indexOf(startTag);
  const endIdx = html.indexOf(endTag);
  if (startIdx === -1 || endIdx === -1) return html;
  const before = html.slice(0, startIdx);
  const block = html.slice(startIdx + startTag.length, endIdx);
  const after = html.slice(endIdx + endTag.length);
  const repeated = copyLabels.map(label => block.split('__COPY_LABEL__').join(label)).join('');

}

function compressImage(file, maxDim=1600, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// state.files[key]는 이제 파일 배열입니다. 백엔드는 각 파일을 별도 키로 받아 저장하므로,
// 한 항목에 여러 장이 첨부된 경우 key_1, key_2 ... 형태로 풀어서 보냅니다.
// (파일이 1장뿐이면 기존과 동일하게 key 그대로 사용 → OCR 파일명 매칭 그대로 유지)
function buildFilesPayload(filesState){
  const flat = {};
  for(const key in filesState){
    const arr = filesState[key];
    if(!Array.isArray(arr) || arr.length === 0) continue;
    if(arr.length === 1){
      flat[key] = arr[0];
    } else {
      arr.forEach((f, idx) => { flat[`${key}_${idx+1}`] = f; });
    }
  }
  return flat;
}

  let fullUrl = `${baseUrl}?type=payment&service=${encodeURIComponent(service)}`;
  if(service === 'naver'){
    fullUrl += `&naverPlace=${encodeURIComponent(naverPlace)}`;
  }

  navigator.clipboard.writeText(fullUrl).then(() => {
    toast('가맹신청 링크가 클립보드에 복사되었습니다!');
    this.closeNewAppModal();
  }).catch(() => {
    prompt('아래 링크를 복사하여 가맹점에 전달하세요:', fullUrl);
    this.closeNewAppModal();
  });
},

async submitPaymentApplication(){
  // 상호명은 state.fields.storeName으로 들어옵니다 (관리자가 생성한 링크로 들어오면 미리 채워짐)
  const storeName = state.fields.storeName || '';
  const storePhone = formatKoreanPhone(document.getElementById('pay_storePhone')?.value || '');
  const ownerPhone = formatKoreanPhone(document.getElementById('pay_ownerPhone')?.value || '');
  const email = document.getElementById('pay_email')?.value || '';

  // UI에서 받는 항목(상호명, 매장전화번호, 대표명의 폰번호, 이메일) 모두 필수로 검사
  if(!storeName || !storePhone || !ownerPhone || !email){
    toast('상호명, 매장전화번호, 대표명의 폰번호, 메일주소를 입력해 주세요'); 
    return;
  }

  // required 서류 검사 (기존 로직 유지)
  const currentDocs = getRequiredDocs();
  const missing = currentDocs.filter(d => d.required && (!state.files[d.key] || state.files[d.key].length === 0));
  if(missing.length > 0){
    const labels = missing.map(m => m.label).join(', ');
    toast('다음 서류가 누락되었습니다: ' + labels);
    return;
  }

  const submitBtn = document.querySelector('.btn-primary');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '제출 중...'; }
  showSubmitOverlay();

  const id = 'F' + new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14) + '-' + Math.floor(Math.random()*900+100);
  const createdAt = new Date().toISOString();
  // [폴더 규칙] 관리자가 지정한 가맹점명 뒤에 서비스명을 붙여서 저장한다 → "가맹점명-토스" / "가맹점명-네이버"
  const serviceSuffix = state.paymentService === 'naver' ? '네이버' : '토스';
  const folderStoreName = `${storeName}-${serviceSuffix}`;

  try {
    const payload = {
      id: id,
      createdAt: createdAt,
      storeName: folderStoreName,
      storePhone: storePhone,
      ownerPhone: ownerPhone,
      email: email,
      service: state.paymentService === 'naver' ? 'naver' : 'toss',
      naverPlace: state.paymentNaverPlace,
      filesData: buildFilesPayload(state.files)
    };

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const res = await response.json();

    if (res && res.extracted) {
      this.applyExtractedData(res.extracted);
    }

    this.clearTempData();

    state.receiptId = id;
    state.files = {};
    state.view = 'success';
    hideSubmitOverlay();
    render();
  } catch(e) {
    hideSubmitOverlay();
    toast('제출 중 오류가 발생했습니다. 다시 시도해 주세요.');
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = (state.isPaymentMode ? (state.paymentService === 'naver' ? '네이버 가맹 서류 제출하기' : '토스 가맹 서류 제출하기') : '제출하기'); }
  }
},

          if(ex.ownerNameMatch !== undefined) m.ownerNameMatch = ex.ownerNameMatch;

          if(ex.accountNumber) m.accountNumber = ex.accountNumber;
          if(ex.birthDate) m.birthDate = ex.birthDate;

  // 장비 모델 직접입력 처리기: App에 메서드로 추가
App.setModel = function(category, key, mode, value){
  const modelField = mode === 'pos' ? 'posModel' : 'terminalModel';
  const otherField = mode === 'pos' ? 'posModelOther' : 'terminalModelOther';
  if(!state.selection[category] || !state.selection[category][key]) return;
  state.selection[category][key][modelField] = value;
  if(value !== 'other') state.selection[category][key][otherField] = '';
  render();
};

App.setModelOther = function(category, key, mode, value){
  const otherField = mode === 'pos' ? 'posModelOther' : 'terminalModelOther';
  if(!state.selection[category] || !state.selection[category][key]) return;
  state.selection[category][key][otherField] = value;
  // 실시간 렌더링이 필요하면 render(); 호출 (입력중 렌더링이 부담이면 주석 처리)
  // render();
};
window.App = App;

// [계약서 사본 연동] 임대/판매계약서를 여러 부(보관용/고객용 등) 출력할 때, 위약금·VAN이용료처럼
// 직접 수정 가능한(contenteditable) 조항은 각 사본마다 동일한 내용이 복제되어 있다.
// data-sync-key가 같은 요소 중 하나를 수정하면 나머지 사본에도 즉시 같은 값이 반영되도록
// document 레벨에서 한 번만 이벤트를 위임해 감시한다 (재렌더링돼도 이 리스너 자체는 유지됨).
document.addEventListener('input', function(e){
  const target = e.target;
  if(!target || !target.matches || !target.matches('[data-sync-key]')) return;
  const key = target.getAttribute('data-sync-key');
  if(!key) return;
  const text = target.textContent;
  document.querySelectorAll('[data-sync-key="' + key + '"]').forEach(function(el){
    if(el !== target && el.textContent !== text) el.textContent = text;
  });
});

render();
</script>
