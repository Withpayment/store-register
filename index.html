<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>가맹점 서류 접수 및 계약서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
  font-weight:700; font-display:swap;
}
@font-face{
  font-family:'Plex Mono';
  src:url('https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  font-weight:500; font-display:swap;
}

:root{
  --bg:#F1F3F6;
  --paper:#FFFFFF;
  --ink:#10233D;
  --ink-soft:#5B6B7A;
  --line:#E1E5EA;
  --line-strong:#C7CFD8;
  --teal:#12A398;
  --teal-deep:#0B7A72;
  --forest:#2F8F5B;
  --forest-bg:#EAF6EF;
  --red:#E24C4C;
  --red-bg:#FDEDED;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,35,61,0.04), 0 8px 24px rgba(16,35,61,0.06);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'Plex Mono','Pretendard',monospace;}

#app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:700;font-size:15px;
  box-shadow:var(--shadow);
}
.brand-text{font-weight:700;font-size:16px;letter-spacing:-0.01em;}
.brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

.secret-zone {
  width: 70px; 
  height: 40px; 
  background: transparent; 
  cursor: default; 
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow);
}
.section-title{font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
.section-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 24px;line-height:1.5;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.field .req{color:var(--red);margin-left:2px;}
.field .optional{color:var(--ink-soft);font-weight:400;font-size:11.5px;margin-left:4px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password],.field select, .field input[type=date]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;
  font-family:'Pretendard';background:#FCFCFD;transition:.12s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:white;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}

.radio-group{display:flex;gap:20px;margin-top:8px;}
.radio-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;}
.radio-label input{accent-color:var(--teal);width:18px;height:18px;cursor:pointer;}

.opt-group-label{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px;}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.doc-grid{grid-template-columns:1fr;}}
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;cursor:pointer;
  transition:.14s;position:relative;overflow:hidden;background:#FBFBFC;
}
.dropzone:hover{border-color:var(--teal);background:#F1FBFA;}
.dropzone.filled{border-style:solid;border-color:var(--forest);background:var(--forest-bg);}
.dz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.dz-title{font-size:13px;font-weight:600;}
.dz-title .req{color:var(--red);}
.dz-title .optional{color:var(--ink-soft);font-weight:400;font-size:11px;}
.dz-status{font-size:11px;color:var(--ink-soft);}
.dz-status.ok{color:var(--forest);font-weight:600;}
.dz-preview{margin-top:9px;display:flex;align-items:center;gap:9px;}
.dz-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:0 0 44px;}
.dz-filename{font-size:11.5px;color:var(--ink-soft);word-break:break-all;line-height:1.4;}
.dz-placeholder{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.dz-remove{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:0;margin-left:auto;flex:0 0 auto;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Pretendard';font-size:15px;font-weight:600;padding:14px 20px;border-radius:11px;
  border:none;cursor:pointer;transition:.14s;width:100%;
}
.btn-primary{background:var(--ink);color:white;}
.btn-primary:hover{background:#0A1A2E;}
.btn-primary:disabled{background:var(--line-strong);color:#9AA5B1;cursor:not-allowed;}
.btn-row{margin-top:24px;display:flex;gap:10px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.success-wrap{max-width:520px;margin:40px auto;text-align:center;}
.success-badge{
  width:72px;height:72px;border-radius:50%;background:var(--forest-bg);color:var(--forest);
  display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;
}
.success-wrap h2{font-size:22px;margin:0 0 8px;}
.success-wrap p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 22px;}
.receipt-num{
  display:inline-block;font-family:'Plex Mono';font-size:14px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:9px 16px;font-weight:600;letter-spacing:.02em;margin-bottom:24px;
}

.admin-login{max-width:360px;margin:60px auto;}
.admin-search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;margin-bottom:16px;font-family:'Pretendard';}

/* ===== 장비 선택 화면 ===== */
.eq-item{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#FBFBFC;}
.eq-item.active{border-color:var(--teal);background:#F1FBFA;}
.eq-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.eq-item-name{font-size:14.5px;font-weight:700;}
.eq-item-price{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.eq-stepper{display:flex;align-items:center;gap:10px;}
.eq-stepper button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:white;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);}
.eq-stepper button:hover{border-color:var(--teal);color:var(--teal);}
.eq-stepper .eq-qty{width:32px;text-align:center;font-weight:700;font-size:14.5px;}
.eq-options{margin-top:12px;display:flex;gap:16px;}
.eq-options label{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer;}
.eq-options input{accent-color:var(--teal);}
.eq-summary{position:sticky;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);padding:16px 0 4px;margin-top:8px;}
.eq-summary-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:var(--ink-soft);}
.eq-summary-row.total{font-size:15px;font-weight:700;color:var(--ink);}

/* ===== 계약서 및 CMS 동의서 (각각 A4 1장씩 분리 스타일) ===== */
.contract-page{
  background:white;border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 28px;box-shadow:var(--shadow);font-size:11px;line-height:1.45;
  margin-bottom:24px;
}
.contract-top-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:14px;letter-spacing:1px;}
.ref-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
.ref-table th,.ref-table td{border:1px solid #111;padding:6px 8px;text-align:center;}
.ref-table th{background:#F2F2F2;font-weight:600;}
.ref-table td.al{text-align:left;}

.contract-intro{margin-bottom:12px;font-size:11px;text-align:justify;}
.clause-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
.clause-col{display:flex;flex-direction:column;gap:8px;}
.contract-doc .clause{margin-bottom:4px;text-align:justify;}
.contract-doc .clause b{display:inline;margin-right:4px;}
.contract-table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px;}
.contract-table th,.contract-table td{border:1px solid #111;padding:4px 6px;text-align:center;}
.contract-table th{background:#F2F2F2;}
.contract-table td.al{text-align:left;}
.contract-note{font-size:10px;color:var(--ink-soft);margin:4px 0;}
.editable-penalty{background:#FFFDF0;border:1px dashed var(--teal);padding:2px 6px;border-radius:4px;display:inline-block;outline:none;}
.editable-penalty:focus{background:#FFF;border-style:solid;}

/* CMS 동의서 독립 페이지 스타일 */
.cms-page{
  background:white;border:1px solid var(--line);border-radius:var(--radius);
  padding:32px;box-shadow:var(--shadow);font-size:12px;line-height:1.6;
}
.cms-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:16px;}
.cms-table{width:100%;border-collapse:collapse;font-size:12px;margin:16px 0;}
.cms-table th,.cms-table td{border:1px solid #111;padding:10px 12px;}
.cms-table th{background:#F2F2F2;text-align:center;font-weight:600;}
.cms-table td.al{text-align:left;}
.cms-desc{font-size:11.5px;color:#333;line-height:1.5;margin-bottom:16px;text-align:justify;}

.no-print{margin-top:20px;display:flex;gap:10px;}

@media print{
  @page { size: A4 portrait; margin: 10mm; }
  body{background:white;}
  .no-print,.topbar{display:none !important;}
  #app{max-width:none;padding:0;}
  .contract-page{border:none;box-shadow:none;padding:0;margin:0;page-break-after:always; break-after:page;}
  .cms-page{border:none;box-shadow:none;padding:0;margin:0;page-break-after:always; break-after:page;}
  .editable-penalty{border:none;background:transparent;padding:0;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxRaJWbSsDdpdi0qPq2OwBtjUvGKQdZTtpwd2EeTG7Gqqwu1erITuvDXkIAMoWKZI-Z/exec";

const BUSINESS_TYPES = [
  { id: 'general', name: '일반 도소매/서비스업 (일반 사업자)' },
  { id: 'food', name: '음식점 / 카페 / 유흥주점 (식품위생업)' },
  { id: 'beauty', name: '미용실 / 피부샵 / 네일샵 (공중위생업)' },
  { id: 'academy', name: '학원 / 교습소' }
];

const COMMON_DOCS = [
  { key:'bankbook', label:'통장사본', accept:'image/*,.pdf', hint:'입금 계좌 통장 첫 페이지', required:true },
  { key:'bizLicense', label:'사업자등록증', accept:'image/*,.pdf', hint:'사업자등록증 사본', required:true },
  { key:'interiorPhoto', label:'매장 내부 사진', accept:'image/*', hint:'매장 내부 전경', required:true },
  { key:'insideOutsidePhoto', label:'내부에서 외부가 보이는 사진', accept:'image/*', hint:'출입구 방향으로 촬영', required:true }
];

const EXTRA_DOCS = {
  food: { key:'permitLicense', label:'영업신고증', accept:'image/*,.pdf', hint:'식품영업신고증 사본', required:true },
  beauty: { key:'permitLicense', label:'공중위생 영업신고증', accept:'image/*,.pdf', hint:'영업신고증 사본', required:true },
  academy: { key:'permitLicense', label:'학원(교습소) 설립운영 등록증', accept:'image/*,.pdf', hint:'등록증 사본', required:true }
};

function getRequiredDocs(businessType, bizType, hasSign){
  let docs = [...COMMON_DOCS];
  if(bizType === 'corporate') {
    docs.unshift({ key:'corpReg', label:'법인등기부등본', accept:'image/*,.pdf', hint:'말일 포함 최근 등기부등본', required:true });
    docs.unshift({ key:'corpSeal', label:'법인인감증명서', accept:'image/*,.pdf', hint:'최근 3개월 이내 발급분', required:true });
    docs.push({ key:'shareholder', label:'주주명부', accept:'image/*,.pdf', hint:'최신 주주명부 사본', required:true });
  } else {
    docs.unshift({ key:'idCard', label:'대표자 신분증', accept:'image/*', hint:'주민등록증 또는 운전면허증 사진', required:true });
  }
  if(EXTRA_DOCS[businessType]){ docs.splice(4, 0, EXTRA_DOCS[businessType]); }
  if(hasSign === 'yes') {
    docs.push({ key:'exteriorPhoto', label:'외부 사진 (간판 포함)', accept:'image/*', hint:'간판이 잘 보이도록 촬영', required:true });
  } else {
    docs.push({ key:'addressPlate', label:'도로명주소판 사진', accept:'image/*', hint:'건물에 부착된 도로명주소판 근접 촬영', required:true });
    docs.push({ key:'addressBuildingPhoto', label:'도로명주소 포함 건물 사진', accept:'image/*', hint:'도로명주소와 건물이 함께 나오게 촬영', required:true });
  }
  return docs;
}

const LESSOR = {
  name: '위드페이먼트',
  bizNo: '409-86-50093',
  address: '광주광역시 서구 유덕로 114',
  ceo: '고영배'
};

const RENTAL_CATALOG = {
  posSet: {
    key:'posSet', label:'포스set (포스+금전함+프린터)', monthlyPrice:15000,
    hasOption:true,
    indemnityByOption: { naver: 1710000, toss: 1710000 }
  },
  cardTerminal: {
    key:'cardTerminal', label:'카드단말기', monthlyPrice:5000,
    hasOption:true,
    indemnityByOption: { naver: 400000, toss: 400000 }
  },
  tableOrderNormal: { key:'tableOrderNormal', label:'테이블오더 (주문전용)', monthlyPrice:11000, indemnity: 350000 },
  tableOrderPrepay: { key:'tableOrderPrepay', label:'테이블오더 (선불형)', monthlyPrice:13000, indemnity: 350000 }
};
const RENTAL_ADDONS = {
  kitchenPrinter: { key:'kitchenPrinter', label:'주방프린터 추가', monthlyPrice:5000, indemnity:150000 },
  orderPosRefurb: { key:'orderPosRefurb', label:'오더포스(리퍼) 추가', monthlyPrice:10000, indemnity:800000 }
};

function defaultSelection(){
  return {
    rental: {
      posSet:{ qty:0, option:'naver' },
      cardTerminal:{ qty:0, option:'naver' },
      tableOrderNormal:{ qty:0 },
      tableOrderPrepay:{ qty:0 }
    },
    addons: {
      kitchenPrinter:{ qty:0 },
      orderPosRefurb:{ qty:0 }
    }
  };
}

let state = {
  view: location.hash === '#admin' ? 'adminLogin' : 'form',
  fields: { storeName:'', ownerName:'', bizNo:'', businessType:'general', bizType:'personal', storePhone:'', ownerPhone:'', email:'', hasSign:'yes' },
  files: {},
  receiptId: null,
  adminUnlocked: false,
  adminToken: null,
  adminMerchants: [],
  adminSearch: '',
  contractMerchant: null,
  selection: defaultSelection(),
  contractPeriodYears: 3,
  installDate: new Date().toISOString().slice(0,10),
  cmsBankName: '국민은행',
  cmsAccountNo: '123456-04-123456',
  cmsDepositor: ''
};

function syncFields(){
  state.fields.storeName = document.getElementById('f_storeName')?.value || state.fields.storeName;
  state.fields.ownerName = document.getElementById('f_ownerName')?.value || state.fields.ownerName;
  state.fields.bizNo = document.getElementById('f_bizNo')?.value || state.fields.bizNo;
  state.fields.businessType = document.getElementById('f_businessType')?.value || state.fields.businessType;
  state.fields.storePhone = document.getElementById('f_storePhone')?.value || state.fields.storePhone;
  state.fields.ownerPhone = document.getElementById('f_ownerPhone')?.value || state.fields.ownerPhone;
  state.fields.email = document.getElementById('f_email')?.value || state.fields.email;
  
  const bizRadio = document.querySelector('input[name="f_bizType"]:checked');
  if(bizRadio) state.fields.bizType = bizRadio.value;

  const signRadio = document.querySelector('input[name="f_hasSign"]:checked');
  if(signRadio) state.fields.hasSign = signRadio.value;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function render(){
  const app = document.getElementById('app');
  if(state.view === 'form') app.innerHTML = topbar() + renderForm();
  else if(state.view === 'success') app.innerHTML = topbar() + renderSuccess();
  else if(state.view === 'adminLogin') app.innerHTML = renderAdminLogin();
  else if(state.view === 'admin') app.innerHTML = renderAdmin();
  else if(state.view === 'equipmentSelect') app.innerHTML = topbar() + renderEquipmentSelect();
  else if(state.view === 'contract') app.innerHTML = renderContract();
}

function topbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="brand-text">가맹점 서류 접수</div>
        <div class="brand-sub">정보 입력 및 서류 제출</div>
      </div>
    </div>
    <div class="secret-zone" onclick="App.handleSecretClick()"></div>
  </div>`;
}

function renderForm(){
  const f = state.fields;
  const currentDocs = getRequiredDocs(f.businessType, f.bizType, f.hasSign);
  const requiredDocsCount = currentDocs.filter(d => d.required).length;
  const filledRequiredCount = currentDocs.filter(d => d.required && state.files[d.key]).length;

  return `
  <div class="card">
    <div class="section-title">가맹점 정보 및 서류 제출</div>
    <div class="section-sub">사업자 형태, 업종 및 간판 유무에 따라 필요한 서류 항목이 자동으로 변경됩니다.</div>

    <div class="field">
      <label>사업자 구분 <span class="req">*</span></label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="f_bizType" value="personal" ${f.bizType==='personal'?'checked':''} onchange="App.changeFormState()"> 개인사업자</label>
        <label class="radio-label"><input type="radio" name="f_bizType" value="corporate" ${f.bizType==='corporate'?'checked':''} onchange="App.changeFormState()"> 법인사업자</label>
      </div>
    </div>

    <div class="grid2" style="margin-top:18px;">
      <div class="field">
        <label>상호명(매장명) <span class="req">*</span></label>
        <input type="text" id="f_storeName" placeholder="예: 카페 온기" value="${f.storeName}">
      </div>
      <div class="field">
        <label>대표자명 <span class="req">*</span></label>
        <input type="text" id="f_ownerName" placeholder="예: 홍길동" value="${f.ownerName}">
      </div>
    </div>

    <div class="field">
      <label>사업자등록번호</label>
      <input type="text" id="f_bizNo" placeholder="예: 123-45-67890" value="${f.bizNo}">
    </div>

    <div class="field">
      <label>업종 선택 <span class="req">*</span></label>

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function escapeAttr(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function fmt(n){ return Number(n||0).toLocaleString('ko-KR'); }

function calcRentalMonthly(sel){
  let total = 0;
  for(const key in RENTAL_CATALOG){
    const item = RENTAL_CATALOG[key];
    const s = sel.rental[key];
    if(s && s.qty > 0) total += item.monthlyPrice * s.qty;
  }
  for(const key in RENTAL_ADDONS){
    const item = RENTAL_ADDONS[key];
    const s = sel.addons[key];
    if(s && s.qty > 0) total += item.monthlyPrice * s.qty;
  }
  return total;
}

function buildIndemnityRows(sel){
  const rows = [];
  for(const key in RENTAL_CATALOG){
    const item = RENTAL_CATALOG[key];
    const s = sel.rental[key];
    if(!s || s.qty <= 0) continue;
    let unit;
    if(item.hasOption){
      unit = item.indemnityByOption[s.option];
      var optionLabel = s.option === 'naver' ? '네이버커넥트' : '토스프론트';
    } else {
      unit = item.indemnity;
      var optionLabel = '';
    }
    rows.push({
      name: item.label + (optionLabel ? ` (${optionLabel})` : ''),
      qty: s.qty,
      unit: unit,
      amount: (unit==null ? null : unit * s.qty)
    });
  }
  for(const key in RENTAL_ADDONS){
    const item = RENTAL_ADDONS[key];
    const s = sel.addons[key];
    if(!s || s.qty <= 0) continue;
    rows.push({
      name: item.label,
      qty: s.qty,
      unit: item.indemnity,
      amount: (item.indemnity==null ? null : item.indemnity * s.qty)
    });
  }
  return rows;
}

function hasAnySelection(sel){
  const rentalQty = Object.values(sel.rental).some(s=>s.qty>0);
  const addonQty = Object.values(sel.addons).some(s=>s.qty>0);
  return rentalQty || addonQty;
}

      </div>
      <table class="cms-table">
        <tr>

          <td style="width:30%">(주)위드페이먼트</td>

    <div class="no-print">
      <button class="btn btn-primary" style="background:var(--paper); color:var(--ink); border:1.5px solid var(--line);" onclick="App.backToEquip()">← 장비 및 기간 설정 수정</button>

      <button class="btn btn-primary" style="background:var(--paper); color:var(--ink); border:1.5px solid var(--line);" onclick="App.finishContract()">완료 (목록으로)</button>
    </div>

function compressImage(file, maxDim=1600, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const App = {
  secretClickTimer: null,
  secretClicks: 0,
  
  handleSecretClick(){
    this.secretClicks++;
    if(this.secretClicks >= 2){
      this.goAdmin();
      this.secretClicks = 0;
      clearTimeout(this.secretClickTimer);
    } else {
      this.secretClickTimer = setTimeout(() => { this.secretClicks = 0; }, 500);
    }
  },

  changeFormState(){
    syncFields();
    render();
  },

  async handleFile(key, file){
    if(!file) return;
    syncFields();
    const currentDocs = getRequiredDocs(state.fields.businessType, state.fields.bizType, state.fields.hasSign);
    const docDef = currentDocs.find(d=>d.key===key);
    if(file.size > 15*1024*1024){ toast('파일 용량이 너무 큽니다 (15MB 이하)'); return; }
    toast('파일 처리 중...');
    try{
      const isImage = file.type.startsWith('image/');
      let dataUrl;
      if(isImage) dataUrl = await compressImage(file);
      else dataUrl = await readAsDataURL(file);
      state.files[key] = { name:file.name, dataUrl, isImage };
      render();
      toast(docDef.label + ' 첨부 완료');
    }catch(e){
      toast('파일 처리 중 오류가 발생했습니다');
    }
  },
  
  removeFile(key){
    syncFields();
    delete state.files[key];
    render();
  },

  handleUnauthorized(){
    state.adminToken = null;
    state.view = 'adminLogin';
    render();
    toast('세션이 만료되었습니다. 다시 로그인해 주세요.');
  },

  async loadGoogleData() {
    if(!state.adminToken){ this.handleUnauthorized(); return; }
    toast('구글 시트에서 최신 데이터를 불러오는 중...');
    try {
      const url = API_URL + '?token=' + encodeURIComponent(state.adminToken);
      const response = await fetch(url);
      const result = await response.json();

      if(result.status === 'success') {
        state.adminMerchants = result.data || [];
        render();
        toast('최신 데이터 동기화 완료!');
      } else if(result.status === 'unauthorized') {
        this.handleUnauthorized();
      } else {
        toast('데이터 불러오기 실패');
      }
    } catch(e) {
      toast('서버 통신 오류');
    }
  },

  async completeAndDelete(id, storeName) {
    if(!state.adminToken){ this.handleUnauthorized(); return; }
    if(!confirm(`[${storeName}] 가맹점 서류 확인 및 접수 처리를 완료하셨습니까?\n확인을 누르면 시트 내역과 드라이브의 모든 사진 파일이 개인정보 보호를 위해 영구 삭제됩니다.`)) {
      return;
    }

    toast('처리 완료 및 데이터 삭제 중...');
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'deleteMerchant', id: id, token: state.adminToken })
      });
      const result = await response.json();

      if(result.status === 'success') {
        toast('처리가 완료되어 해당 정보와 파일이 안전하게 삭제되었습니다.');
        App.loadGoogleData();
      } else if(result.status === 'unauthorized') {
        this.handleUnauthorized();
      } else {
        toast('삭제 처리에 실패했습니다.');
      }
    } catch(e) {
      toast('서버 통신 오류가 발생했습니다.');
    }
  },

  async submit(){
    syncFields();
    const f = state.fields;
    if(!f.storeName || !f.ownerName || !f.storePhone || !f.ownerPhone || !f.email){
      toast('필수 정보를 모두 입력해 주세요'); return;
    }
    const currentDocs = getRequiredDocs(f.businessType, f.bizType, f.hasSign);
    const missing = currentDocs.filter(d => d.required && !state.files[d.key]);
    if(missing.length > 0){
      toast(missing[0].label + ' 등 필수 서류를 첨부해 주세요'); return;
    }
    const submitBtn = document.querySelector('.btn-primary');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '제출 중...'; }

    const id = 'F' + new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14) + '-' + Math.floor(Math.random()*900+100);
    const createdAt = new Date().toISOString();

    try {
      const payload = {
        id: id,
        createdAt: createdAt,
        storeName: f.storeName,
        ownerName: f.ownerName,
        bizNo: f.bizNo,
        storePhone: f.storePhone,
        ownerPhone: f.ownerPhone,
        email: f.email,
        bizType: f.bizType === 'corporate' ? '법인' : '개인',
        filesData: state.files
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      state.receiptId = id;
      state.files = {};
      state.fields = { storeName:'', ownerName:'', bizNo:'', businessType:'general', bizType:'personal', storePhone:'', ownerPhone:'', email:'', hasSign:'yes' };
      state.view = 'success';
      render();
    } catch(e) {
      toast('저장 중 오류가 발생했습니다. 다시 시도해 주세요.');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '접수 제출하기'; }
    }
  },

  resetAll(){
    state = { view:'form', fields:{storeName:'',ownerName:'',bizNo:'',businessType:'general',bizType:'personal',storePhone:'',ownerPhone:'',email:'',hasSign:'yes'}, files:{}, receiptId:null, adminUnlocked:false, adminToken:null, adminMerchants:[], adminSearch:'' };
    location.hash='';
    render();
  },

  goForm(){ location.hash=''; state.view='form'; render(); },
  goAdmin(){ location.hash='admin'; state.view='adminLogin'; render(); },

  logoutAdmin(){
    state.adminToken = null;
    state.adminUnlocked = false;
    state.adminMerchants = [];
    state.view = 'adminLogin';
    location.hash = 'admin';
    render();
  },

  async tryAdminLogin(){
    const passInput = document.getElementById('admin_pass');
    const val = passInput.value;
    const btn = document.getElementById('admin_login_btn');
    if(btn){ btn.disabled = true; btn.textContent = '확인 중...'; }

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', password: val })
      });
      const result = await response.json();

      if(result.status === 'success' && result.token){
        state.adminToken = result.token;
        state.adminUnlocked = true;
        state.view = 'admin';
        render();
        App.loadGoogleData();
      } else if(result.status === 'locked'){
        toast('시도 횟수를 초과했습니다. 잠시 후 다시 시도해 주세요.');
      } else {
        toast('접근 코드가 올바르지 않습니다');
      }
    } catch(e) {
      toast('서버 통신 오류가 발생했습니다.');
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = '확인'; }
      if(passInput) passInput.value = '';
    }
  },

  setAdminSearch(v){ state.adminSearch = v; render(); },

  goEquipmentSelect(merchantId){
    const m = (state.adminMerchants || []).find(x => x.id === merchantId);
    if(!m){ toast('가맹점 정보를 찾을 수 없습니다'); return; }
    state.contractMerchant = m;
    state.selection = defaultSelection();
    state.contractPeriodYears = 3;
    state.installDate = new Date().toISOString().slice(0,10);
    state.contractBizNo = m.bizNo || '';
    state.contractBirth6 = '';
    state.contractAddress = '';
    state.cmsBankName = '국민은행';
    state.cmsAccountNo = '123456-04-123456';
    state.cmsDepositor = m.ownerName || '';
    state.view = 'equipmentSelect';
    render();
  },

  changeQty(category, key, delta){
    const s = state.selection[category][key];
    s.qty = Math.max(0, Math.min(99, s.qty + delta));
    render();
  },

  setOption(category, key, option){
    state.selection[category][key].option = option;
    render();
  },

  setPeriod(val){
    state.contractPeriodYears = Number(val);
  },

  setInstallDate(val){
    state.installDate = val;
  },

  setExtraField(fieldKey, val){
    state[fieldKey] = val;
  },

  goContract(){
    if(!hasAnySelection(state.selection)){
      toast('임대 품목을 1개 이상 선택해 주세요');
      return;
    }
    state.view = 'contract';
    render();
  },

  backToEquip(){ state.view = 'equipmentSelect'; render(); },

  backToAdminFromEquip(){
    state.contractMerchant = null;
    state.view = 'admin';
    render();
  },

  finishContract(){
    state.contractMerchant = null;
    state.selection = defaultSelection();
    location.hash = 'admin';
    state.view = 'admin';
    render();
  }
};
window.App = App;

render();
</script>
