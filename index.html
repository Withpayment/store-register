<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>가맹점 서류 접수 및 계약서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
  font-weight:700; font-display:swap;
}
@font-face{
  font-family:'Plex Mono';
  src:url('https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  font-weight:500; font-display:swap;
}

:root{
  --bg:#F1F3F6;
  --paper:#FFFFFF;
  --ink:#10233D;
  --ink-soft:#5B6B7A;
  --line:#E1E5EA;
  --line-strong:#C7CFD8;
  --teal:#12A398;
  --teal-deep:#0B7A72;
  --forest:#2F8F5B;
  --forest-bg:#EAF6EF;
  --red:#E24C4C;
  --red-bg:#FDEDED;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,35,61,0.04), 0 8px 24px rgba(16,35,61,0.06);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'Plex Mono','Pretendard',monospace;}

#app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:700;font-size:15px;
  box-shadow:var(--shadow);
}
.brand-text{font-weight:700;font-size:16px;letter-spacing:-0.01em;}
.brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

.secret-zone {
  width: 70px; 
  height: 40px; 
  background: transparent; 
  cursor: default; 
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow);
}
.section-title{font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
.section-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 24px;line-height:1.5;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.field .req{color:var(--red);margin-left:2px;}
.field .optional{color:var(--ink-soft);font-weight:400;font-size:11.5px;margin-left:4px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password],.field select, .field input[type=date]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;
  font-family:'Pretendard';background:#FCFCFD;transition:.12s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:white;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}

.radio-group{display:flex;gap:20px;margin-top:8px;}
.radio-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;}
.radio-label input{accent-color:var(--teal);width:18px;height:18px;cursor:pointer;}

.opt-group-label{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px;}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.doc-grid{grid-template-columns:1fr;}}
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;cursor:pointer;
  transition:.14s;position:relative;overflow:hidden;background:#FBFBFC;
}
.dropzone:hover{border-color:var(--teal);background:#F1FBFA;}
.dropzone.filled{border-style:solid;border-color:var(--forest);background:var(--forest-bg);}
.dz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.dz-title{font-size:13px;font-weight:600;}
.dz-title .req{color:var(--red);}
.dz-title .optional{color:var(--ink-soft);font-weight:400;font-size:11px;}
.dz-status{font-size:11px;color:var(--ink-soft);}
.dz-status.ok{color:var(--forest);font-weight:600;}
.dz-preview{margin-top:9px;display:flex;align-items:center;gap:9px;}
.dz-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:0 0 44px;}
.dz-filename{font-size:11.5px;color:var(--ink-soft);word-break:break-all;line-height:1.4;}
.dz-placeholder{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.dz-remove{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:0;margin-left:auto;flex:0 0 auto;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Pretendard';font-size:15px;font-weight:600;padding:14px 20px;border-radius:11px;
  border:none;cursor:pointer;transition:.14s;width:100%;
}
.btn-primary{background:var(--ink);color:white;}
.btn-primary:hover{background:#0A1A2E;}
.btn-primary:disabled{background:var(--line-strong);color:#9AA5B1;cursor:not-allowed;}
.btn-secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);}
.btn-secondary:hover{background:#F8FAFC;}
.btn-row{margin-top:24px;display:flex;gap:10px;}

.temp-save-box {
  background: #F8FAFC;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.temp-save-info { font-size: 13px; color: var(--ink-soft); }
.temp-save-btns { display: flex; gap: 8px; }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; width: auto; }

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.success-wrap{max-width:520px;margin:40px auto;text-align:center;}
.success-badge{
  width:72px;height:72px;border-radius:50%;background:var(--forest-bg);color:var(--forest);
  display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;
}
.success-wrap h2{font-size:22px;margin:0 0 8px;}
.success-wrap p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 22px;}
.receipt-num{
  display:inline-block;font-family:'Plex Mono';font-size:14px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:9px 16px;font-weight:600;letter-spacing:.02em;margin-bottom:24px;
}

.admin-login{max-width:360px;margin:60px auto;}
.admin-search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;margin-bottom:16px;font-family:'Pretendard';}

.eq-item{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#FBFBFC;}
.eq-item.active{border-color:var(--teal);background:#F1FBFA;}
.eq-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.eq-item-name{font-size:14.5px;font-weight:700;}
.eq-item-price{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.eq-stepper{display:flex;align-items:center;gap:10px;}
.eq-stepper button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:white;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);}
.eq-stepper button:hover{border-color:var(--teal);color:var(--teal);}
.eq-stepper .eq-qty{width:32px;text-align:center;font-weight:700;font-size:14.5px;}
.eq-options{margin-top:12px;display:flex;gap:16px;}
.eq-options label{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer;}
.eq-options input{accent-color:var(--teal);}
.eq-summary{position:sticky;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);padding:16px 0 4px;margin-top:8px;}
.eq-summary-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:var(--ink-soft);}
.eq-summary-row.total{font-size:15px;font-weight:700;color:var(--ink);}

.contract-page{
  background:white;border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 28px;box-shadow:var(--shadow);font-size:11px;line-height:1.45;
  margin-bottom:24px;
}
.contract-top-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:14px;letter-spacing:1px;}
.ref-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
.ref-table th,.ref-table td{border:1px solid #111;padding:6px 8px;text-align:center;}
.ref-table th{background:#F2F2F2;font-weight:600;}
.ref-table td.al{text-align:left;}

.contract-intro{margin-bottom:12px;font-size:11px;text-align:justify;}
.clause-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
.clause-col{display:flex;flex-direction:column;gap:8px;}
.contract-doc .clause{margin-bottom:4px;text-align:justify;}
.contract-doc .clause b{display:inline;margin-right:4px;}
.contract-table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px;}
.contract-table th,.contract-table td{border:1px solid #111;padding:4px 6px;text-align:center;}
.contract-table th{background:#F2F2F2;}
.contract-table td.al{text-align:left;}
.contract-note{font-size:10px;color:var(--ink-soft);margin:4px 0;}
.editable-penalty{background:#FFFDF0;border:1px dashed var(--teal);padding:2px 6px;border-radius:4px;display:inline-block;outline:none;}
.editable-penalty:focus{background:#FFF;border-style:solid;}

/* 모달 레이어 스타일 */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(16, 35, 61, 0.4); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-box {
  background: white; border-radius: var(--radius); width: 100%; max-width: 540px;
  max-height: 85vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow);
}
.modal-title { font-size: 16.5px; font-weight: 700; margin-bottom: 6px; }
.modal-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }
.modal-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.modal-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.modal-item input { accent-color: var(--teal); width: 18px; height: 18px; cursor: pointer; }

/* CMS 동의서 전용 스타일 */
.cms-page{
  background:white;border:1px solid var(--line);border-radius:var(--radius);
  padding:30px;box-shadow:var(--shadow);font-size:12px;line-height:1.5;color:#333;
}
.cms-page h1 {
  text-align: center; font-size: 20px; text-decoration: underline; margin-bottom: 20px; letter-spacing: 2px; font-weight: 700;
}
.cms-page h2 {
  font-size: 14px; margin-top: 18px; margin-bottom: 8px; font-weight: 700;
}
.cms-page table {
  width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 12px;
}
.cms-page th, .cms-page td {
  border: 1px solid #000; padding: 6px 8px; vertical-align: middle;
}
.cms-page th {
  background-color: #f2f2f2; text-align: center; font-weight: bold; width: 18%;
}
.cms-page td {
  text-align: left;
}
.cms-page .center-text { text-align: center; }
.cms-page .consent-box {
  border: 1px solid #000; padding: 10px 12px; font-size: 11px; margin-bottom: 12px; background-color: #fafafa;
}
.cms-page .consent-title {
  font-weight: bold; font-size: 12px; margin-top: 8px; margin-bottom: 4px;
}
.cms-page .consent-title:first-child { margin-top: 0; }
.cms-page .consent-content { margin-left: 8px; margin-bottom: 6px; color: #444; }
.cms-page .consent-check {
  text-align: right; font-weight: bold; margin-top: 4px; margin-bottom: 6px; font-size: 11.5px;
}
.cms-page .highlight {
  background-color: #ffeb3b; padding: 2px 5px; border-radius: 3px;
}
.cms-page .submit-notice {
  text-align: center; font-size: 12.5px; font-weight: bold; margin: 16px 0 12px 0;
}
.cms-page .date {
  text-align: center; font-size: 15px; font-weight: bold; margin-bottom: 16px;
}
.cms-page .signature-table { width: 85%; margin: 0 auto 10px auto; }
.cms-page .signature-table th { width: 25%; }
.cms-page .footer-note { font-size: 10.5px; color: #666; margin-top: 8px; }

.no-print{margin-top:20px;display:flex;gap:10px;}

@media print{
  @page { size: A4 portrait; margin: 10mm; }
  body{background:white; color:#000;}
  .no-print,.topbar,.toast{display:none !important;}
  #app{max-width:none;padding:0;margin:0;}
  .contract-page{
    border:none !important;box-shadow:none !important;padding:0 !important;margin:0 !important;
    page-break-after:always !important; break-after:page !important;
  }
  .cms-page{
    border:none !important;box-shadow:none !important;padding:0 !important;margin:0 !important;
    page-break-after:always !important; break-after:page !important;
  }
  .editable-penalty{border:none !important;background:transparent !important;padding:0 !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzIzF9bTvfJ-lvuxJ7YmmbBK46Wln1jVsOk-gVK1_8YMI3oZgK8hoZOChX3HXHvpCtV/exec";
const TEMP_SAVE_KEY = "merchant_form_temp_data";

// 16가지 보완서류 목록 정의
const SUPPLEMENT_DOC_LIST = [
  { key: 'supp_1', label: '공동대표자 가맹점 가입 동의 및 위임장' },
  { key: 'supp_2', label: '결제계좌 이용신청 및 동의서' },
  { key: 'supp_3', label: '제3자 결제계좌 등록 요청 및 동의서' },
  { key: 'supp_4', label: '미성년자업주 법정대리인 동의서' },
  { key: 'supp_5', label: '신청서 작성 위임장' },
  { key: 'supp_6', label: '복수 가맹점 신청서' },
  { key: 'supp_7', label: '등록단말기 미설치 사유서' },
  { key: 'supp_8', label: '고객거래확인서 (대리인접수시, 개인공동대표추가시 겸용)' },
  { key: 'supp_9', label: '본인 전자서명 확인서' },
  { key: 'supp_10', label: '선불카드 미수납 사유서' },
  { key: 'supp_11', label: '개인정보 처리 관련 알기쉬운 안내 양식 (만14세 미만 대상)' },
  { key: 'supp_12', label: '가맹점 권리포기 동의서' },
  { key: 'supp_13', label: '고객거래확인서 (법인용)' },
  { key: 'supp_14', label: '법인소유지배자 확인서' },
  { key: 'supp_15', label: '실제소유자확인 공문 양식 (카드사 공통)' },
  { key: 'supp_16', label: '표준서식 전체' }
];

const BUSINESS_TYPES = [
  { id: 'general', name: '일반 도소매/서비스업 (일반 사업자)' },
  { id: 'food', name: '음식점 / 카페 / 유흥주점 (식품위생업)' },
  { id: 'beauty', name: '미용실 / 피부샵 / 네일샵 (공중위생업)' },
  { id: 'academy', name: '학원 / 교습소' }
];

const COMMON_DOCS = [
  { key:'bankbook', label:'통장사본', accept:'image/*,.pdf', hint:'입금 계좌 통장 첫 페이지', required:true },
  { key:'bizLicense', label:'사업자등록증', accept:'image/*,.pdf', hint:'사업자등록증 사본', required:true },
  { key:'interiorPhoto', label:'매장 내부 사진', accept:'image/*', hint:'매장 내부 전경', required:true },
  { key:'insideOutsidePhoto', label:'내부에서 외부가 보이는 사진', accept:'image/*', hint:'출입구 방향으로 촬영', required:true }
];

const EXTRA_DOCS = {
  food: { key:'permitLicense', label:'영업신고증', accept:'image/*,.pdf', hint:'식품영업신고증 사본', required:true },
  beauty: { key:'permitLicense', label:'공중위생 영업신고증', accept:'image/*,.pdf', hint:'영업신고증 사본', required:true },
  academy: { key:'permitLicense', label:'학원(교습소) 설립운영 등록증', accept:'image/*,.pdf', hint:'등록증 사본', required:true }
};

function parseQueryParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    type: params.get('type'),
    receiptId: params.get('id'),
    docs: params.get('docs') ? params.get('docs').split(',') : []
  };
}

const urlParams = parseQueryParams();

function getRequiredDocs(businessType, bizType, hasSign){
  if (state.isSupplementMode && state.supplementDocKeys.length > 0) {
    return SUPPLEMENT_DOC_LIST.filter(d => state.supplementDocKeys.includes(d.key)).map(d => ({
      key: d.key,
      label: d.label,
      accept: 'image/*,.pdf',
      hint: `${d.label} 사본 첨부`,
      required: true
    }));
  }

  let docs = [...COMMON_DOCS];
  if(bizType === 'corporate') {
    docs.unshift({ key:'corpReg', label:'법인등기부등본', accept:'image/*,.pdf', hint:'말일 포함 최근 등기부등본', required:true });
    docs.unshift({ key:'corpSeal', label:'법인인감증명서', accept:'image/*,.pdf', hint:'최근 3개월 이내 발급분', required:true });
    docs.push({ key:'shareholder', label:'주주명부', accept:'image/*,.pdf', hint:'최신 주주명부 사본', required:true });
  } else {
    docs.unshift({ key:'idCard', label:'대표자 신분증', accept:'image/*', hint:'주민등록증 또는 운전면허증 사진', required:true });
  }
  if(EXTRA_DOCS[businessType]){ docs.splice(4, 0, EXTRA_DOCS[businessType]); }
  if(hasSign === 'yes') {
    docs.push({ key:'exteriorPhoto', label:'외부 사진 (간판 포함)', accept:'image/*', hint:'간판이 잘 보이도록 촬영', required:true });
  } else {
    docs.push({ key:'addressPlate', label:'도로명주소판 사진', accept:'image/*', hint:'건물에 부착된 도로명주소판 근접 촬영', required:true });
    docs.push({ key:'addressBuildingPhoto', label:'도로명주소 포함 건물 사진', accept:'image/*', hint:'도로명주소와 건물이 함께 나오게 촬영', required:true });
  }
  return docs;
}

const RENTAL_CATALOG = {
  posSet: {
    key:'posSet', label:'포스set (포스+금전함+프린터)', monthlyPrice:15000,
    hasOption:true,
    indemnityByOption: { naver: 1710000, toss: 1710000 }
  },
  cardTerminal: {
    key:'cardTerminal', label:'카드단말기', monthlyPrice:5000,
    hasOption:true,
    indemnityByOption: { naver: 400000, toss: 400000 }
  },
  tableOrderNormal: { key:'tableOrderNormal', label:'테이블오더 (주문전용)', monthlyPrice:11000, indemnity: 350000 },

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function syncFields(){
  if(state.isSupplementMode) return;
  state.fields.storeName = document.getElementById('f_storeName')?.value || state.fields.storeName;
  state.fields.ownerName = document.getElementById('f_ownerName')?.value || state.fields.ownerName;
  state.fields.bizNo = document.getElementById('f_bizNo')?.value || state.fields.bizNo;
  state.fields.businessType = document.getElementById('f_businessType')?.value || state.fields.businessType;
  state.fields.storePhone = document.getElementById('f_storePhone')?.value || state.fields.storePhone;
  state.fields.ownerPhone = document.getElementById('f_ownerPhone')?.value || state.fields.ownerPhone;
  state.fields.email = document.getElementById('f_email')?.value || state.fields.email;
  
  const bizRadio = document.querySelector('input[name="f_bizType"]:checked');
  if(bizRadio) state.fields.bizType = bizRadio.value;

  const signRadio = document.querySelector('input[name="f_hasSign"]:checked');
  if(signRadio) state.fields.hasSign = signRadio.value;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function render(){
  const app = document.getElementById('app');
  if(state.view === 'form') app.innerHTML = topbar() + renderForm();
  else if(state.view === 'success') app.innerHTML = topbar() + renderSuccess();
  else if(state.view === 'adminLogin') app.innerHTML = renderAdminLogin();
  else if(state.view === 'admin') app.innerHTML = renderAdmin();
  else if(state.view === 'equipmentSelect') app.innerHTML = topbar() + renderEquipmentSelect();
  else if(state.view === 'contract') app.innerHTML = renderContract();

  if(state.activeModalMerchant) {
    app.innerHTML += renderSupplementModal();
  }
}

      </div>
    </div>

  </div>`;
}

    </div>

      <label>사업자등록번호</label>

function renderDropzone(d){
  const f = state.files[d.key];
  const labelBadge = d.required ? `<span class="req">*</span>` : `<span class="optional">(선택)</span>`;
  return `
  <div class="dropzone ${f?'filled':''}" onclick="document.getElementById('file_${d.key}').click()">
    <input type="file" id="file_${d.key}" accept="${d.accept}" style="display:none" onchange="App.handleFile('${d.key}', this.files[0])">
    <div class="dz-head">
      <div class="dz-title">${d.label} ${labelBadge}</div>
      <div class="dz-status ${f?'ok':''}">${f?'첨부완료':'미첨부'}</div>
    </div>
    ${f ? `
      <div class="dz-preview">
        ${f.isImage ? `<img class="dz-thumb" src="${f.dataUrl}">` : `<div class="dz-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);">FILE</div>`}
        <div class="dz-filename">${f.name}</div>
        <button class="dz-remove" onclick="event.stopPropagation();App.removeFile('${d.key}')">삭제</button>
      </div>
    ` : `<div class="dz-placeholder">${d.hint}</div>`}
  </div>`;
}

function renderEquipmentSelect(){
  const m = state.contractMerchant;
  if(!m) return '';

  let totalMonthly = 0;
  for(let key in RENTAL_CATALOG){
    const item = RENTAL_CATALOG[key];
    const sel = state.selection.rental[key];
    if(sel && sel.qty > 0) totalMonthly += item.monthlyPrice * sel.qty;
  }
  for(let key in RENTAL_ADDONS){
    const item = RENTAL_ADDONS[key];
    const sel = state.selection.addons[key];
    if(sel && sel.qty > 0) totalMonthly += item.monthlyPrice * sel.qty;
  }

  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>

      const sel = state.selection.rental[key];

      return `
      <div class="eq-item ${active?'active':''}">
        <div class="eq-item-head">
          <div>
            <div class="eq-item-name">${item.label}</div>
            <div class="eq-item-price">월 ${item.monthlyPrice.toLocaleString()}원</div>
          </div>
          <div class="eq-stepper">
            <button onclick="App.changeQty('rental', '${key}', -1)">-</button>
            <span class="eq-qty">${sel.qty}</span>
            <button onclick="App.changeQty('rental', '${key}', 1)">+</button>
          </div>
        </div>
        ${(item.hasOption && active) ? `
        <div class="eq-options">
          <label><input type="radio" name="opt_${key}" value="naver" ${sel.option==='naver'?'checked':''} onchange="App.changeOption('${key}', 'naver')"> 네이버페이형</label>

      </div>`;
    }).join('')}

    <div class="section-title" style="margin-top:28px;">추가 옵션 장비</div>
    <div class="section-sub">주방프린터 및 오더포스를 추가합니다.</div>

    ${Object.keys(RENTAL_ADDONS).map(key => {
      const item = RENTAL_ADDONS[key];
      const sel = state.selection.addons[key];
      const active = sel.qty > 0;
      return `
      <div class="eq-item ${active?'active':''}">
        <div class="eq-item-head">
          <div>
            <div class="eq-item-name">${item.label}</div>
            <div class="eq-item-price">월 ${item.monthlyPrice.toLocaleString()}원</div>
          </div>
          <div class="eq-stepper">
            <button onclick="App.changeQty('addons', '${key}', -1)">-</button>
            <span class="eq-qty">${sel.qty}</span>
            <button onclick="App.changeQty('addons', '${key}', 1)">+</button>
          </div>
        </div>
      </div>`;
    }).join('')}

    <div class="eq-summary">
      <div class="eq-summary-row total">
        <span>총 월 임대료</span>
        <span style="color:var(--teal);">${totalMonthly.toLocaleString()} 원 / 월 (VAT 별도)</span>
      </div>
    </div>

    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-secondary" onclick="App.goAdmin()" style="width:30%;">뒤로가기</button>
      <button class="btn btn-primary" onclick="App.goToContractView()" style="width:70%;">계약서 및 CMS 동의서 생성</button>
    </div>
  </div>`;
}

function renderContract(){
  const m = state.contractMerchant;
  if(!m) return '';

  let totalMonthly = 0;
  let itemsList = [];
  
  for(let key in RENTAL_CATALOG){
    const item = RENTAL_CATALOG[key];
    const sel = state.selection.rental[key];
    if(sel && sel.qty > 0) {
      let optText = item.hasOption ? (sel.option==='toss'?'(토스프론트)':'(네이버페이)') : '';
      let ind = item.hasOption ? item.indemnityByOption[sel.option] : item.indemnity;
      itemsList.push({ label: item.label + optText, qty: sel.qty, monthly: item.monthlyPrice, indemnity: ind });
      totalMonthly += item.monthlyPrice * sel.qty;
    }
  }
  for(let key in RENTAL_ADDONS){
    const item = RENTAL_ADDONS[key];
    const sel = state.selection.addons[key];
    if(sel && sel.qty > 0) {
      itemsList.push({ label: item.label, qty: sel.qty, monthly: item.monthlyPrice, indemnity: item.indemnity });
      totalMonthly += item.monthlyPrice * sel.qty;
    }
  }

  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');

  return `
  <div class="no-print" style="max-width:960px; margin:0 auto 16px; display:flex; justify-content:space-between; align-items:center;">
    <button class="btn btn-secondary btn-sm" onclick="App.goEquipmentSelect()">← 장비 선택으로 돌아가기</button>
    <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ 인쇄 / PDF 저장하기</button>
  </div>

  <div class="contract-page contract-doc">
    <div class="contract-top-title">포스 / 단말기 임대차 설치 계약서</div>
    
    <div class="contract-intro">
      임대인 <b>(주)스마트포스시스템</b>(이하 "갑")과 임차인 <b>${escapeHtml(m.storeName)}</b>(이하 "을")은 아래와 같이 임대차 계약을 체결한다.
    </div>

    <table class="ref-table">
      <tr>
        <th style="width:15%;">상 호 명</th>
        <td style="width:35%;">${escapeHtml(m.storeName)}</td>
        <th style="width:15%;">대 표 자</th>
        <td style="width:35%;">${escapeHtml(m.ownerName)}</td>
      </tr>
      <tr>
        <th>사업자번호</th>
        <td><input type="text" value="${escapeHtml(state.contractBizNo || m.bizNo || m.bizNumber || '')}" oninput="state.contractBizNo=this.value" style="border:none; width:100%; text-align:center; font-size:11px;"></td>
        <th>생년월일</th>
        <td><input type="text" placeholder="YYMMDD" value="${escapeHtml(state.contractBirth6 || m.birthDate || '')}" oninput="state.contractBirth6=this.value" style="border:none; width:100%; text-align:center; font-size:11px;"></td>
      </tr>
      <tr>
        <th>사업장주소</th>
        <td colspan="3"><input type="text" value="${escapeHtml(state.contractAddress || m.address || '')}" oninput="state.contractAddress=this.value" style="border:none; width:100%; text-align:left; font-size:11px;"></td>
      </tr>
      <tr>
        <th>연 락 처</th>
        <td>${escapeHtml(m.ownerPhone || m.storePhone)}</td>
        <th>설치예정일</th>
        <td><input type="date" value="${state.installDate}" onchange="state.installDate=this.value" style="border:none; font-size:11px;"></td>
      </tr>
    </table>

    <table class="contract-table">
      <thead>
        <tr>
          <th>임대 품목 / 모델명</th>
          <th>수량</th>

      </thead>
      <tbody>
        ${itemsList.length === 0 ? `<tr><td colspan="4">선택된 임대 품목이 없습니다.</td></tr>` : itemsList.map(it => `

            </td>
          </tr>
        `).join('')}
        <tr style="background:#F8FAFC; font-weight:700;">
          <td colspan="2">합 계</td>
          <td>${totalMonthly.toLocaleString()} 원 / 월</td>
          <td>-</td>
        </tr>
      </tbody>
    </table>

    <div class="clause-grid" style="margin-top:14px;">
      <div class="clause-col">
        <div class="clause"><b>제1조 (목적)</b> 본 계약은 "갑"이 소유한 포스 및 단말기 장비를 "을"에게 임대하고, "을"은 이를 적정하게 사용하여 임대료를 지급하는 것을 목적합니다.</div>
        <div class="clause"><b>제2조 (계약기간)</b> 계약기간은 설치 완료일로부터 <select onchange="state.contractPeriodYears=this.value" style="border:1px solid #ccc; font-size:10px;"><option value="3" ${state.contractPeriodYears==3?'selected':''}>3년(36개월)</option><option value="2" ${state.contractPeriodYears==2?'selected':''}>2년(24개월)</option></form></select>로 하며, 만료 1개월 전 서면 통지가 없는 경우 1년씩 자동 연장됩니다.</div>
        <div class="clause"><b>제3조 (임대료 지급)</b> "을"은 지정된 결제일에 CMS 자동이체 방식으로 월 임대료를 지급합니다.</div>
      </div>
      <div class="clause-col">
        <div class="clause"><b>제4조 (유지보수 및 관리)</b> "갑"은 임대 장비의 정상 작동을 위한 A/S를 제공하며, "을"의 고의/과실로 인한 파손 및 분실 시 "을"이 변상 책임을 집니다.</div>
        <div class="clause"><b>제5조 (계약 해지 및 위약금)</b> "을"의 사정으로 약정 기간 내 중도 해지 시, 잔여 기간 임대료의 30%에 해당하는 위약금과 장비 수거비용을 "갑"에게 지급해야 합니다.</div>
        <div class="clause"><b>제6조 (관할법원)</b> 본 계약에 관한 분쟁은 "갑"의 소재지 관할 법원으로 합니다.</div>
      </div>
    </div>

    <div style="margin-top:20px; text-align:center; font-weight:700;">
      ${year}년 ${month}월 ${day}일
    </div>

    <div style="display:flex; justify-content:space-around; margin-top:20px; font-weight:700;">
      <div>임대인 (갑): (주)스마트포스시스템 (인)</div>
      <div>임차인 (을): ${escapeHtml(m.ownerName)} (인 / 서명)</div>
    </div>
  </div>

  <div class="cms-page">
    <h1>CMS 출금이체 동의서</h1>

    <h2>1. 신청인 정보</h2>
    <table>
      <tr>
        <th>성 명 (대표자)</th>
        <td>${escapeHtml(m.ownerName)}</td>
        <th>상 호 명</th>
        <td>${escapeHtml(m.storeName)}</td>
      </tr>
      <tr>
        <th>생년월일</th>
        <td>${escapeHtml(state.contractBirth6 || m.birthDate || '')}</td>
        <th>전화번호</th>
        <td>${escapeHtml(m.ownerPhone || m.storePhone)}</td>
      </tr>
    </table>

    <h2>2. 출금계좌 정보</h2>
    <table>
      <tr>
        <th>금융기관명</th>
        <td><input type="text" value="${escapeHtml(state.cmsBankName || m.bankName || '')}" oninput="state.cmsBankName=this.value" style="border:none; width:100%; font-size:12px;" placeholder="예: 국민은행"></td>
        <th>계좌번호</th>
        <td><input type="text" value="${escapeHtml(state.cmsAccountNo || m.accountNumber || '')}" oninput="state.cmsAccountNo=this.value" style="border:none; width:100%; font-size:12px;" placeholder="숫자만 입력"></td>
      </tr>
      <tr>
        <th>예금주명</th>
        <td colspan="3"><input type="text" value="${escapeHtml(state.cmsDepositor || m.ownerName || '')}" oninput="state.cmsDepositor=this.value" style="border:none; width:100%; font-size:12px;"></td>
      </tr>
    </table>

    <h2>3. 개인정보 수집·이용 및 제3자 제공 동의</h2>
    <div class="consent-box">
      <div class="consent-title">[개인정보 수집 및 이용 동의]</div>
      <div class="consent-content">
        - 수집·이용 목적: CMS 출금이체를 통한 월 임대료 자동수납<br>
        - 수집 항목: 성명, 생년월일, 금융기관명, 계좌번호, 전화번호<br>
        - 보유 및 이용기간: 수납 완료 후 5년간 보관
      </div>
      <div class="consent-check">동의함 [ v ]</div>

      <div class="consent-title">[개인정보 제3자 제공 동의]</div>
      <div class="consent-content">
        - 제공받는 자: 사단법인 금융결제원, 해당 금융기관<br>
        - 제공 목적: CMS 출금이체 서비스 제공 및 출금동의 확인<br>
        - 제공 항목: 성명, 생년월일, 금융기관명, 계좌번호
      </div>
      <div class="consent-check">동의함 [ v ]</div>
    </div>

    <div class="submit-notice">
      본인은 상기 계좌에서 (주)스마트포스시스템이 청구하는 월 임대료가 자동이체 처리되는 것에 동의합니다.
    </div>

    <div class="date">${year}년 ${month}월 ${day}일</div>

    <table class="signature-table">
      <tr>
        <th>예금주 서명</th>
        <td style="text-align:center; height:50px;">${escapeHtml(state.cmsDepositor || m.ownerName)} (인 / 서명)</td>
      </tr>
    </table>
  </div>`;
}

const App = {
  handleSecretClick(){
    if(!this.__clicks) this.__clicks = 0;
    this.__clicks++;
    if(this.__clicks >= 5){
      this.__clicks = 0;
      state.view = state.adminUnlocked ? 'admin' : 'adminLogin';
      render();
    }
  },

  changeFormState(){
    syncFields();
    render();
  },

  handleFile(key, file){
    if(!file) return;
    const isImg = file.type.startsWith('image/');
    const reader = new FileReader();
    reader.onload = (e) => {
      state.files[key] = {
        name: file.name,
        type: file.type,
        dataUrl: e.target.result,
        isImage: isImg
      };
      render();
    };
    reader.readAsDataURL(file);
  },

  removeFile(key){
    delete state.files[key];
    render();
  },

  saveTempData(){
    syncFields();
    const payload = {
      fields: state.fields,
      savedAt: new Date().toLocaleString('ko-KR')
    };
    localStorage.setItem(TEMP_SAVE_KEY, JSON.stringify(payload));
    toast("현재 작성 중인 데이터가 임시저장되었습니다.");
    render();
  },

  loadTempData(){
    const saved = localStorage.getItem(TEMP_SAVE_KEY);
    if(saved){
      try {
        const parsed = JSON.parse(saved);
        state.fields = { ...state.fields, ...parsed.fields };
        toast("임시 저장된 데이터를 불러왔습니다.");
        render();
      } catch(e){ toast("데이터를 불러오지 못했습니다."); }
    }
  },

  clearTempData(){
    localStorage.removeItem(TEMP_SAVE_KEY);
    toast("임시 저장 데이터가 삭제되었습니다.");
    render();
  },

  async submit(){
    syncFields();
    const f = state.fields;

    if(!f.storeName || !f.ownerName || !f.storePhone || !f.ownerPhone || !f.email) {
      toast("필수 입력 정보를 모두 기입해 주세요.");
      return;
    }

    const currentDocs = getRequiredDocs(f.businessType, f.bizType, f.hasSign);
    for(let d of currentDocs) {
      if(d.required && !state.files[d.key]) {
        toast(`필수 서류 [${d.label}] 항목을 첨부해 주세요.`);
        return;
      }
    }

    toast("데이터를 서버로 안전하게 전송 중입니다...");

    const payload = {
      action: "submitMerchant",
      storeName: f.storeName,
      ownerName: f.ownerName,
      bizNo: f.bizNo,
      businessType: f.businessType,
      bizType: f.bizType,
      storePhone: f.storePhone,
      ownerPhone: f.ownerPhone,
      email: f.email,
      hasSign: f.hasSign,
      filesData: state.files
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(data.status === 'success'){
        state.receiptId = data.extracted ? (data.extracted.id || 'R-' + Date.now().toString().slice(-6)) : 'R-' + Date.now().toString().slice(-6);
        localStorage.removeItem(TEMP_SAVE_KEY);
        state.view = 'success';
        render();
      } else {
        toast("제출 실패: " + (data.message || "오류가 발생했습니다."));
      }
    } catch(err) {
      toast("전송 중 네트워크 오류가 발생했습니다.");
    }
  },

  async submitSupplement(){
    const currentDocs = getRequiredDocs();
    for(let d of currentDocs) {
      if(d.required && !state.files[d.key]) {
        toast(`[${d.label}] 서류를 첨부해 주세요.`);
        return;
      }
    }

    toast("보완 서류를 업로드하고 있습니다...");

    const payload = {
      action: "submitSupplement",
      receiptId: state.receiptId,
      filesData: state.files
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(data.status === 'success'){
        state.view = 'success';
        render();
      } else {
        toast("보완서류 제출 실패: " + (data.message || "오류 발생"));
      }
    } catch(e){
      toast("전송 중 오류가 발생했습니다.");
    }
  },

  async tryAdminLogin(){
    const pass = document.getElementById('admin_pass')?.value;
    if(!pass) return toast("접근 코드를 입력하세요.");

    toast("인증 확인 중...");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", password: pass })
      });
      const data = await res.json();
      if(data.status === 'success'){
        state.adminUnlocked = true;
        state.adminToken = data.token;
        state.view = 'admin';
        this.loadGoogleData();
      } else {
        toast("비밀번호가 올바르지 않습니다.");
      }
    } catch(e){
      toast("로그인 중 통신 오류가 발생했습니다.");
    }
  },

  async loadGoogleData(){
    toast("가맹점 목록을 불러오는 중...");
    try {
      const res = await fetch(`${API_URL}?token=${state.adminToken}`);
      const data = await res.json();
      if(data.status === 'success'){
        state.adminMerchants = data.data || [];
        render();
        toast("최신 목록으로 업데이트되었습니다.");
      } else {
        toast("데이터 불러오기 실패: " + data.message);
      }
    } catch(e){
      toast("목록 조회 중 오류가 발생했습니다.");
    }
  },

  logoutAdmin(){
    state.adminUnlocked = false;
    state.adminToken = null;
    state.view = 'form';
    render();
  },

  goForm(){
    state.view = 'form';
    render();
  },

  goAdmin(){
    state.view = 'admin';
    render();
  },

  setAdminSearch(val){
    state.adminSearch = val;
    render();
  },

  openSupplementModal(id){
    const m = state.adminMerchants.find(item => item.id === id);
    if(m) {
      state.activeModalMerchant = m;
      state.selectedModalDocs = [];
      render();
    }
  },

  closeSupplementModal(){
    state.activeModalMerchant = null;
    render();
  },

  toggleModalDoc(key){
    const idx = state.selectedModalDocs.indexOf(key);
    if(idx > -1) state.selectedModalDocs.splice(idx, 1);
    else state.selectedModalDocs.push(key);
  },

  generateSupplementLink(){
    if(state.selectedModalDocs.length === 0) {
      toast("최소 하나 이상의 보완 요청 서류를 선택하세요.");
      return;
    }
    const m = state.activeModalMerchant;
    const baseUrl = window.location.origin + window.location.pathname;
    const docsStr = state.selectedModalDocs.join(',');
    const link = `${baseUrl}?type=supplement&id=${m.id}&docs=${docsStr}`;

    navigator.clipboard.writeText(link).then(() => {
      toast("보완서류 제출 링크가 클립보드에 복사되었습니다!");
      this.closeSupplementModal();
    }).catch(() => {
      prompt("아래 링크를 복사하여 가맹점에 전달하세요:", link);
      this.closeSupplementModal();
    });
  },

  async reOcrMerchant(id){
    toast("OCR 분석을 다시 진행합니다...");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "reOcrMerchant", token: state.adminToken, id: id })
      });
      const data = await res.json();
      if(data.status === 'success'){
        toast("OCR 분석이 완료되었습니다.");
        this.loadGoogleData();
      } else {
        toast("OCR 재시도 실패: " + data.message);
      }
    } catch(e){
      toast("OCR 처리 중 오류가 발생했습니다.");
    }
  },

  async deleteMerchant(id){
    if(!confirm("정말로 이 가맹점 내역과 드라이브 폴더를 삭제하시겠습니까?")) return;
    toast("삭제 처리 중...");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "deleteMerchant", token: state.adminToken, id: id })
      });
      const data = await res.json();
      if(data.status === 'success'){
        toast("성공적으로 삭제되었습니다.");
        this.loadGoogleData();
      } else {
        toast("삭제 실패: " + data.message);
      }
    } catch(e){
      toast("삭제 중 통신 오류가 발생했습니다.");
    }
  },

  openContractForMerchant(id){
    const m = state.adminMerchants.find(item => item.id === id);
    if(m) {
      state.contractMerchant = m;
      state.selection = defaultSelection();
      state.view = 'equipmentSelect';
      render();
    }
  },

  goEquipmentSelect(){
    state.view = 'equipmentSelect';
    render();
  },

  changeQty(group, key, delta){
    const target = state.selection[group][key];
    if(target) {
      target.qty = Math.max(0, target.qty + delta);
      render();
    }
  },

  changeOption(key, optionVal){
    if(state.selection.rental[key]){
      state.selection.rental[key].option = optionVal;
      render();
    }
  },

  goToContractView(){
    let totalQty = 0;
    for(let k in state.selection.rental) totalQty += state.selection.rental[k].qty;
    for(let k in state.selection.addons) totalQty += state.selection.addons[k].qty;

    if(totalQty === 0){
      toast("최소 하나 이상의 임대 장비를 선택해야 합니다.");
      return;
    }
    state.view = 'contract';
    render();
  },

  resetAll(){
    state.files = {};
    state.receiptId = null;
    state.fields = { storeName:'', ownerName:'', bizNo:'', businessType:'general', bizType:'personal', storePhone:'', ownerPhone:'', email:'', hasSign:'yes' };
    state.view = 'form';
    window.location.href = window.location.pathname;
  }
};

window.App = App;
window.onload = () => render();
</script>
</body>
</html>
