<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>가맹점 서류 접수 및 계약서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
  font-weight:700; font-display:swap;
}
@font-face{
  font-family:'Plex Mono';
  src:url('https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  font-weight:500; font-display:swap;
}

:root{
  --bg:#F1F3F6;
  --paper:#FFFFFF;
  --ink:#10233D;
  --ink-soft:#5B6B7A;
  --line:#E1E5EA;
  --line-strong:#C7CFD8;
  --teal:#12A398;
  --teal-deep:#0B7A72;
  --forest:#2F8F5B;
  --forest-bg:#EAF6EF;
  --red:#E24C4C;
  --red-bg:#FDEDED;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,35,61,0.04), 0 8px 24px rgba(16,35,61,0.06);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'Plex Mono','Pretendard',monospace;}

#app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
#app.admin-app{max-width:1440px;}
.admin-table-scroll{overflow-x:auto;}
.admin-table{width:100%;min-width:1510px;border-collapse:collapse;text-align:left;font-size:13.5px;}
.admin-table th{white-space:nowrap;}
.admin-table .no-wrap{white-space:nowrap;}
.admin-actions{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;min-width:405px;white-space:nowrap;}
.inline-edit-button{margin-left:6px;background:var(--paper);color:var(--teal-deep);border:1px solid var(--line-strong);padding:3px 7px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.inline-edit-button:hover{border-color:var(--teal);background:#F1FBFA;}
@media(max-width:700px){
  #app.admin-app{padding:18px 12px 48px;}
  .topbar{align-items:flex-start;gap:14px;flex-direction:column;}
}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:700;font-size:15px;
  box-shadow:var(--shadow);
}
.brand-text{font-weight:700;font-size:16px;letter-spacing:-0.01em;}
.brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

.secret-zone {
  width: 70px; 
  height: 40px; 
  background: transparent; 
  cursor: default; 
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow);
}
.section-title{font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
.section-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 24px;line-height:1.5;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.field .req{color:var(--red);margin-left:2px;}
.field .optional{color:var(--ink-soft);font-weight:400;font-size:11.5px;margin-left:4px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password],.field select, .field input[type=date]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;
  font-family:'Pretendard';background:#FCFCFD;transition:.12s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:white;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}

.radio-group{display:flex;gap:20px;margin-top:8px;}
.radio-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;}
.radio-label input{accent-color:var(--teal);width:18px;height:18px;cursor:pointer;}

.opt-group-label{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px;}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.doc-grid{grid-template-columns:1fr;}}
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;cursor:pointer;
  transition:.14s;position:relative;overflow:hidden;background:#FBFBFC;
}
.dropzone:hover{border-color:var(--teal);background:#F1FBFA;}
.dropzone.filled{border-style:solid;border-color:var(--forest);background:var(--forest-bg);}
.dz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.dz-title{font-size:13px;font-weight:600;}
.dz-title .req{color:var(--red);}
.dz-title .optional{color:var(--ink-soft);font-weight:400;font-size:11px;}
.dz-status{font-size:11px;color:var(--ink-soft);}
.dz-status.ok{color:var(--forest);font-weight:600;}
.dz-preview{margin-top:9px;display:flex;align-items:center;gap:9px;}
.dz-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:0 0 44px;}
.dz-filename{font-size:11.5px;color:var(--ink-soft);word-break:break-all;line-height:1.4;}
.dz-placeholder{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.dz-remove{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:0;margin-left:auto;flex:0 0 auto;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Pretendard';font-size:15px;font-weight:600;padding:14px 20px;border-radius:11px;
  border:none;cursor:pointer;transition:.14s;width:100%;
}
.btn-primary{background:var(--ink);color:white;}
.btn-primary:hover{background:#0A1A2E;}
.btn-primary:disabled{background:var(--line-strong);color:#9AA5B1;cursor:not-allowed;}
.btn-secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);}
.btn-secondary:hover{background:#F8FAFC;}
.btn-row{margin-top:24px;display:flex;gap:10px;}

/* (생략: 기존 스타일 계속) */
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzx897G3GiSRRBa-czgopntugKEQCtgqbPz7NZrT-gookCKg6r7TCnLdypLW-HfaFKa/exec";
const TEMP_SAVE_KEY = "merchant_form_temp_data";
const CORP_SEAL_IMG = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/4S4aRXhpZgAATU0AKgAAAAgAAwESAAMAAAABAAMAAIdpAAQAAAABAAAIPuocAAcAAAgMAAAAMgAAEF4c6gAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA[...]";

// 기존 JS 코드 (생략: 원본 스크립트 그대로 유지)

</script>

<!-- 추가된 스크립트: IME 보호 및 법인인감 보정 -->
<script>
(function(){
  // IME 조합 플래그
  window.__adminComposing = false;

  function attachAdminSearchHandlers() {
    try {
      const inp = document.querySelector('.admin-search');
      if (!inp) return;

      // prevent duplicate
      if (inp.__adminHandlersAttached) return;

      inp.addEventListener('compositionstart', function(){ window.__adminComposing = true; });
      inp.addEventListener('compositionend', function(e){
        window.__adminComposing = false;
        if (window.App && typeof window.App.setAdminSearch === 'function') {
          window.App.setAdminSearch(e.target.value);
        }
      });
      inp.addEventListener('input', function(e){
        if (!window.__adminComposing) {
          if (window.App && typeof window.App.setAdminSearch === 'function') {
            window.App.setAdminSearch(e.target.value);
          }
        }
      });
      inp.__adminHandlersAttached = true;
    } catch (err) {
      console.error('attachAdminSearchHandlers', err);
    }
  }

  function ensureCorpSeal() {
    try {
      if (typeof CORP_SEAL_IMG === 'undefined' || !CORP_SEAL_IMG) return;

      // 1) If an <img id="corp_seal"> exists, set/refresh src
      const existing = document.getElementById('corp_seal');
      if (existing) {
        if (existing.src !== CORP_SEAL_IMG) existing.setAttribute('src', CORP_SEAL_IMG);
        existing.style.objectFit = 'contain';
        existing.style.maxWidth = existing.style.maxWidth || '160px';
        existing.style.maxHeight = existing.style.maxHeight || '120px';
        existing.onerror = function(){ this.style.display='none'; };
        return;
      }

      // 2) Otherwise, try to find a place to insert the seal: look for text nodes mentioning '법인인감' or '법인인감증명서' or '인감'
      const keywords = ['법인인감', '법인인감증명', '법인인감증명서', '인감'];
      const walker = document.createTreeWalker(document.getElementById('app') || document.body, NodeFilter.SHOW_TEXT, null, false);
      const insertedTargets = [];
      while(walker.nextNode()){
        const txt = walker.currentNode.nodeValue;
        if (!txt) continue;
        for(const kw of keywords) {
          if (txt.indexOf(kw) !== -1) {
            const parent = walker.currentNode.parentElement;
            if (!parent) continue;
            // don't insert multiple times
            if (parent.querySelector && parent.querySelector('img.corp-seal-img')) continue;
            const img = document.createElement('img');
            img.id = 'corp_seal';
            img.className = 'corp-seal-img';
            img.src = CORP_SEAL_IMG;
            img.alt = '법인인감';
            img.style.objectFit = 'contain';
            img.style.maxWidth = '160px';
            img.style.maxHeight = '120px';
            img.style.display = 'inline-block';
            img.style.marginLeft = '8px';
            img.onerror = function(){ this.style.display='none'; };
            parent.appendChild(img);
            insertedTargets.push(parent);
          }
        }
      }

      // 3) Fallback: if we didn't find keyword, try append to signature tables
      if (insertedTargets.length === 0) {
        const sigTables = document.querySelectorAll('.signature-table, .contract-page, .cms-page');
        if (sigTables && sigTables.length > 0) {
          const container = sigTables[0];
          if (!container.querySelector('img.corp-seal-img')) {
            const img = document.createElement('img');
            img.id = 'corp_seal';
            img.className = 'corp-seal-img';
            img.src = CORP_SEAL_IMG;
            img.alt = '법인인감';
            img.style.objectFit = 'contain';
            img.style.maxWidth = '160px';
            img.style.maxHeight = '120px';
            img.style.display = 'block';
            img.style.margin = '8px 0 0 0';
            img.onerror = function(){ this.style.display='none'; };
            container.appendChild(img);
          }
        }
      }
    } catch (err) {
      console.error('ensureCorpSeal', err);
    }
  }

  // Wrap global render to call our attachers after each render
  function wrapRenderIfExists() {
    try {
      if (typeof render === 'function' && !render.__wrappedBySeal) {
        const orig = render;
        window.render = function(){
          const r = orig.apply(this, arguments);
          try{ attachAdminSearchHandlers(); } catch(e){}
          try{ ensureCorpSeal(); } catch(e){}
          return r;
        };
        window.render.__wrappedBySeal = true;
      }
      if (window.App && typeof window.App.render === 'function' && !window.App.render.__wrappedBySeal) {
        const origAppRender = window.App.render.bind(window.App);
        window.App.render = function(){
          const r = origAppRender.apply(this, arguments);
          try{ attachAdminSearchHandlers(); } catch(e){}
          try{ ensureCorpSeal(); } catch(e){}
          return r;
        };
        window.App.render.__wrappedBySeal = true;
      }
    } catch (err) {
      console.error('wrapRenderIfExists', err);
    }
  }

  // Initial attach on DOMContentLoaded and observe mutations
  document.addEventListener('DOMContentLoaded', function(){
    attachAdminSearchHandlers();
    ensureCorpSeal();
    wrapRenderIfExists();

    try {
      const obs = new MutationObserver(function(){
        attachAdminSearchHandlers();
        ensureCorpSeal();
        wrapRenderIfExists();
      });
      obs.observe(document.getElementById('app') || document.body, { childList:true, subtree:true });
      window.__corp_seal_observer = obs;
    } catch (e) { /* noop */ }
  });

  // Also try attach immediately in case render already executed
  setTimeout(function(){ attachAdminSearchHandlers(); ensureCorpSeal(); wrapRenderIfExists(); }, 200);
})();
</script>

</body>
</html>
